services:
  # ---------- Backend API (FastAPI + Docker) ----------
  - type: web
    name: karmathy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # Render mounts Secret Files at /etc/secrets/<filename>.
      # Upload each wallet file (cwallet.sso, tnsnames.ora, sqlnet.ora, ewallet.p12, truststore.jks).
      - key: ORACLE_WALLET_DIR
        value: /etc/secrets
      - key: STORAGE_BACKEND
        value: local
      - key: RULE_PACK_DIR
        value: /app/rule_packs

  # ---------- Frontend (React static site) ----------
  - type: web
    name: karmathy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
