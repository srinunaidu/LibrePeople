name: Deploy LibrePeople to Oracle Cloud

# Manual-approval gate: this workflow NEVER runs automatically on push.
# It starts only when an operator runs it by hand (workflow_dispatch) from
# the chosen ref, and the `production` environment below must have
# "Required reviewers" protection enabled in the repository settings, so a
# second person approves before the SSH step executes. No hostnames are
# invented here: the target host, user, key, repository URL and all secrets
# come entirely from repository secrets / variables.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            if [ ! -d LibrePeople/.git ]; then
              git clone "${{ secrets.DEPLOY_REPO_URL }}" LibrePeople
            fi
            cd LibrePeople
            git fetch origin
            git checkout "${{ inputs.ref }}"
            # Fast-forward when the ref is a branch; a tag/SHA stays detached.
            git pull --ff-only || true
            printf 'DATABASE_URL=%s\n' "${{ secrets.DATABASE_URL }}" > .env
            printf 'SECRET_KEY=%s\n' "${{ secrets.SECRET_KEY }}" >> .env
            printf 'FIELD_ENCRYPTION_KEYS=%s\n' "${{ secrets.FIELD_ENCRYPTION_KEYS }}" >> .env
            printf 'FIELD_ENCRYPTION_ACTIVE_KEY_ID=%s\n' "${{ secrets.FIELD_ENCRYPTION_ACTIVE_KEY_ID }}" >> .env
            # The frontend container is the edge and binds :80. A host nginx
            # from an older cloud-init would hold that port and the deploy
            # would fail with "address already in use".
            sudo systemctl disable --now nginx 2>/dev/null || true
            docker compose down --remove-orphans || true
            docker compose up -d --build
