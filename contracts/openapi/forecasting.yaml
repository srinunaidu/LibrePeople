        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /forecasting/accuracy/sync:
    post:
      operationId: forecastingSyncAccuracy
      tags:
      - forecasting
      security:
      - bearerAuth: []
      summary: Compare a window's forecasts with its actuals
      description: >-
        Runs the accuracy comparison for a window between two dates:
        every completed forecast run with results in the window is
        compared, per month period, location and role, with the actual
        hours the same window measured (approved time entries — leave
        hours are supply-side, not demand), and one accuracy row is
        written per (run, period, location, role) with MAPE, MAE, bias,
        the sample size and a confidence status computed from the MAPE
        against the explicit thresholds of the request. The rows the
        sync computes REPLACE the stored rows for their key, so a
        re-measured window never stacks duplicates. This is the
        callable an after-payroll scheduled job invokes; it is exposed
        as an endpoint so a window can also be run on demand. An
        inverted window or an out-of-order threshold pair is answered
        422.
      x-lifecycle: released
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastAccuracySyncRequest'
      responses:
        '200':
          description: The comparison was recorded; the replaced count and the rows as written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastAccuracySyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
