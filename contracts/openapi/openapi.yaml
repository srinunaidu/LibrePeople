  /leave/requests:
    get:
      operationId: leaveListRequests
      tags:
      - leave
      security:
      - bearerAuth: []
      summary: List leave requests
      description: 'Lists the leave requests of this deployment, newest first. The list is paged; `page`
        and `page_size` control the window. Without `employee_id` the list holds the requests of every
        employee the caller may see: an employee sees their own requests, a manager the requests of their
        team. `status` narrows it to one decision state.'
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: employee_id
        in: query
        required: false
        description: Only the requests of this employee.
        schema:
          type: string
      - name: leave_type_id
        in: query
        required: false
        description: Only requests of this leave type.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only requests in this state.
        schema:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
      - name: from
        in: query
        required: false
        description: Only requests that start on or after this date.
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: Only requests that end on or before this date.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: A page of leave requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeaveRequests'
