                    minimum: 0
                  reject:
                    type: integer
                    minimum: 0
                  accepted:
                    type: integer
                    minimum: 0
                  cancelled:
                    type: boolean
                    description: Always true. A refusal answers 409 instead.
                  import_status:
                    type: string
                    enum:
                    - cancelled
                  committed:
                    type: boolean
                    description: Always false. A committed import cannot be cancelled.
                  note:
                    type: string
