        end_date:
          type: string
          format: date
        demand_total:
          type: integer
          minimum: 0
        covered:
          type: integer
          minimum: 0
        coverage_ratio:
          type: number
          minimum: 0
          maximum: 1
        gaps:
          type: array
          items:
            type: object
            required:
