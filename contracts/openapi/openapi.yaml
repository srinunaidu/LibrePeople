      summary: Publish a roster version
      description: 'Publishes a candidate roster and makes it live. Every hard constraint is re-checked
        at this point, not only at generation time: a candidate that has gone stale, because a leave was
        approved or an employee left in the meantime, is refused with 409 `swap_violates_constraints`
        or 409 `roster_already_published`. The call is idempotent: the same idempotency key with the same
        payload returns the first result, the same key with another payload returns 409 `idempotency_key_reuse`,
        and a request with the same key that is still running returns 409 `request_in_flight`. A missing
        or malformed idempotency key returns 422 `invalid_idempotency_key`.'
