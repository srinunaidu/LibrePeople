      security:
      - bearerAuth: []
      summary: Cancel an import that has not been committed
      description: 'Stops an import that has not finished. The import is one transaction, so cancellation
        is always safe: the rows it had written are taken back with it and nothing is left behind. A queued
        import is stopped by its job at the next batch boundary; a preview that was never committed simply
        stops being usable.

        A committed import cannot be cancelled, and the answer says so (409 `import_not_cancellable`)
        rather than reporting an unknown token. Cancelling twice is idempotent: the second answer is the
        same, and no second audit row is written because nothing changed.

