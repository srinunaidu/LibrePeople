  /leave/reconciliation:
    get:
      operationId: leaveGetReconciliation
      tags:
      - leave
      security:
      - bearerAuth: []
      summary: Reconcile the balances against the ledger
      description: 'Reports every leave balance of this deployment against the ledger that should explain
        it, and the difference between the two. The report is about people: it is limited to the roles
        that may see leave and to the records the caller may see, and it carries the numbers that disagree
        and nothing else — no reason, no description and no diagnosis. A balance with no ledger yet is
        reported separately from one whose ledger and whose cache disagree.'
      x-lifecycle: planned
      parameters:
      - name: year
        in: query
        required: false
        description: Only the balances of this year.
        schema:
          type: integer
          minimum: 2000
          maximum: 2100
      - name: employee_id
        in: query
        required: false
        description: Only the balance of this employee.
        schema:
          type: string
      responses:
        '200':
          description: The reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveReconciliation'
