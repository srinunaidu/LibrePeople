    get:
      operationId: onboardingGetPresetDiff
      tags:
      - onboarding
      security:
      - bearerAuth: []
      summary: Report what a preset would change
      description: 'Reports the difference between a preset and the configuration of this deployment:
        what the preset adds, what it leaves alone, what it would overwrite and what it cannot decide.
        Nothing is changed by the call. The report carries the provenance of every setting: whether the
        value came from the preset, was set by the customer, or is the customer''s change to a value the
        preset suggested. The customer''s own configuration always wins: an entry in `overwrites` is reported
        so that the difference is visible, and the customer''s value is the one that stands. A preset
        that does not exist returns 404 `preset_not_found`.'
      x-lifecycle: planned
      parameters:
      - name: preset_id
        in: path
        required: true
        description: Identifier of the preset.
        schema:
          type: string
      responses:
        '200':
          description: The difference between the preset and this deployment.
          content:
            application/json:
              schema:
                type: object
                required:
                - preset_id
                - preset_version
                - adds
                - unchanged
                - overwrites
                - undecided
                - tenant_only
                - modules_to_enable
                - modules_left_alone
                - exclusions
                - provenance
                - generated_at
                properties:
                  preset_id:
                    type: string
                  preset_version:
                    type: string
                  adds:
                    type: array
                    description: The settings the preset proposes and the customer does not have.
                    items: &id002
                      type: object
                      required:
                      - path
                      - module
                      - action
                      properties:
                        path:
                          type: string
                          description: The setting, as the module and the path inside it.
                        module:
                          type: string
                        action:
                          type: string
                          enum:
                          - add
                          - unchanged
                          - overwrite
                          - undecided
                          - tenant_only
                        preset_value:
                          nullable: true
                        tenant_value:
                          nullable: true
                        note:
                          type: string
                  unchanged:
                    type: array
                    description: The settings the customer already has, with the same value.
                    items: *id002
                  overwrites:
                    type: array
                    description: The settings the customer has with a different value. The customer's
                      value wins.
                    items: *id002
                  undecided:
                    type: array
                    description: The settings the preset cannot decide. They carry the `REQUIRES_RULE_PACK`
                      sentinel and only a verified rule pack fills them.
                    items: *id002
                  tenant_only:
                    type: array
                    description: The settings the customer has and the preset says nothing about.
                    items: *id002
                  modules_to_enable:
                    type: array
                    items:
                      type: string
                  modules_left_alone:
                    type: array
                    items:
                      type: string
                  exclusions:
                    type: array
                    description: What the preset does not decide, and why.
                    items:
                      type: object
                      additionalProperties: true
                  provenance:
                    type: array
                    description: Where each configured value came from.
                    items:
                      type: object
                      required:
                      - path
                      - module
                      - state
                      - origin
                      properties:
                        path:
                          type: string
                        module:
                          type: string
                        state:
                          type: string
                          enum:
                          - preset_default
                          - tenant_override
                          - tenant_set
                          - not_set
                          - unresolved_rule_pack
                        origin:
                          type: string
                          enum:
                          - recorded
                          - derived
                          description: '`recorded` when the customer recorded the provenance, `derived`
                            when the server compared the value with the preset.'
                        preset_value:
                          nullable: true
                        tenant_value:
                          nullable: true
                  generated_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
