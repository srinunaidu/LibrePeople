      description: 'Applies a partial change to the employee record. The fields that describe employment
        — `status`, `employment_type`, `job_id`, `department_id`, `manager_id` and `salary` — are effective-dated:
        the change applies now and appends a history row for each field that actually changed. Name, email,
        phone and hire date are corrections and are audited without a history row.

