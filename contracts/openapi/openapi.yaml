components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token issued by `POST /auth/login`. Send it as `Authorization: Bearer <access_token>`.
        Tokens are JWTs signed by the deployment. A 401 response always carries `WWW-Authenticate: Bearer`.'
  parameters:
    pageParam:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSizeParam:
      name: page_size
      in: query
      required: false
      description: Rows per page. The server may return fewer rows than requested.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key (1-200 characters) that makes this mutation safe to retry. Replaying
        the same key with the same payload returns the original result; replaying it with a different
        payload is a 409 `idempotency_key_reuse`.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    requestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client correlation id. Echoed back in the `X-Request-ID` response header and
        attached to the server log line for this request.
      schema:
        type: string
  headers:
    requestIdHeader:
      description: Correlation id for this request. Quoted in support conversations and matched against
        the server log line.
      schema:
        type: string
  responses:
    ErrorResponse:
      description: The one and only error body. `error.code` is the stable machine readable identifier;
        `error.message` is for display and may be reworded without notice. See `contracts/errors.md`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            not_found:
              summary: The record does not exist or is not visible to the caller
              value:
                error:
                  code: employee_not_found
                  category: not_found
                  message: Employee not found
                  retryable: false
                  details: {}
                  request_id: 01J8Z9K2QF3M7N4P0R5S6T7V8W
    Unauthorized:
      description: The access token is missing, malformed, expired or invalid. The body carries the `unauthenticated`
        code. A client may attempt exactly one token refresh before signing out.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
            example: Bearer
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The caller is authenticated but not permitted. The body carries `forbidden`, `insufficient_scope`,
        `outside_visibility_scope` or `separation_of_duties`. A record that must not be revealed as existing
        is reported as 404, not 403.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The object does not exist, or it is outside the caller's visibility scope. The body
        carries `not_found` or a domain specific variant.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 'The request conflicts with the current state of the resource: a duplicate natural
        key, an illegal state transition, a reused idempotency key, or a concurrent modification. The
        body carries the `conflict` or `concurrency` category.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: 'The request failed validation. The body carries the `validation` category; `details`
        holds the field level context for the specific code (for example `password_policy_violation` carries
        `{violations: [...]}`).'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: The caller exceeded a rate limit. The body carries the `rate_limit` category and the
        `Retry-After` header states how long to wait.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DependencyUnavailable:
      description: A required dependency (database, object storage, solver, rule pack loader) is unavailable.
        The body carries the `dependency` category and the `Retry-After` header states how long to wait.
        The identical request may succeed later.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: An unexpected server side failure. The body carries the `internal` category and the
        `request_id`; technical detail is logged server side and never returned.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Error:
      type: object
      description: The single error object. Mirrors `contracts/errors.md` section 1; the two must be changed
        together.
      required:
      - code
      - category
      - message
      - retryable
      - details
      - request_id
      properties:
        code:
          type: string
          description: Stable machine readable identifier. Snake case. Clients branch on this and never
            on `message`. Renaming a published code is a breaking change.
          examples:
          - employee_not_found
        category:
          type: string
          description: Drives generic client behaviour (retry, re-authenticate, render a permission state).
          enum:
          - validation
          - auth
          - permission
          - not_found
          - conflict
          - concurrency
          - dependency
          - rate_limit
          - internal
        message:
          type: string
          description: Safe to display to a user. No stack traces, no SQL, no hostnames, no record ids
            that would confirm an object exists. May be reworded at any time, so clients must not parse
            it.
        retryable:
          type: boolean
          description: Whether the identical request may succeed later. True only for `dependency`, `rate_limit`
            and `internal`.
        details:
          type: object
          description: Structured, machine readable context. Empty object when there is nothing to add.
            Must never contain personal data, amounts or identifiers copied from a record.
          additionalProperties: true
        request_id:
          type: string
          description: Correlates the response with the server log line. Echoed in the `X-Request-ID`
            response header.
          examples:
          - 01J8Z9K2QF3M7N4P0R5S6T7V8W
    ErrorEnvelope:
      type: object
      description: The top level error body. `error` is the only key; no other top level key is permitted.
      required:
      - error
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Error'
    PageMeta:
      type: object
      description: Pagination envelope returned with every paged collection.
      required:
      - page
      - page_size
      - total
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          description: The 1-based page that was returned.
        page_size:
          type: integer
          minimum: 1
          maximum: 200
          description: The page size the server applied.
        total:
          type: integer
          minimum: 0
          description: Total number of rows matching the filter.
        total_pages:
          type: integer
          minimum: 0
          description: Total number of pages available at this page size.
    PaginatedResponse:
      type: object
      description: Generic paged collection. Domain variants narrow the `items` array to the entity type
        of the collection.
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PageMeta'
    PaginatedUsers:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AuthUser'
    PaginatedEmployees:
