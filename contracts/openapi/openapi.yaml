                  created:
                    type: integer
                    minimum: 0
                    description: The same number as `create`. The older name, kept.
                  updated:
                    type: integer
                    minimum: 0
                    description: The same number as `update`. The older name, kept.
                  rejected:
                    type: integer
                    minimum: 0
                    description: The same number as `reject`. The older name, kept.
                  skipped:
                    type: integer
                    minimum: 0
                    description: 'Always zero. An import no longer skips rows: a row whose key already
                      exists is updated or left alone, never silently dropped. The older name, kept.'
                  missing_columns:
                    type: array
                    items:
