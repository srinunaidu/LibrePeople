    post:
      operationId: leaveCreateRequest
      tags:
      - leave
      security:
      - bearerAuth: []
      summary: Request leave
      description: Files a leave request for the caller, or for an employee the caller is allowed to file
        for. The quantity is derived from the leave calendar of the employee when it is not supplied.
        A request that overlaps an existing pending or approved request returns 409 `leave_overlaps_existing`;
        a request for more than the balance allows returns 409 `leave_insufficient_balance`; a request
        for a leave type that is not active returns 422 `validation_error`. The balance is reserved when
        the request is filed, not when it is approved.
