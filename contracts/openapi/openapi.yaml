    Health:
      type: object
      description: Deployment health. The deployment holds exactly one customer's data in exactly one
        Oracle schema; the health probe never reveals the schema name or the DSN.
      required:
      - status
      - version
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unhealthy
        version:
          type: string
          description: Running application version.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
    HealthCheck:
      type: object
      required:
      - name
      - status
      properties:
        name:
          type: string
          description: Name of the dependency that was probed.
        status:
          type: string
          enum:
          - ok
          - degraded
          - unhealthy
          - skipped
        detail:
          type: string
          description: Safe to display detail. No DSN, no host, no path.
    JobStatus:
      type: string
      description: Lifecycle state of a background job. A job that exhausts `max_attempts` moves to `dead`
        and stays visible in the dead letter view; a dead job is never silently discarded.
      enum:
      - pending
      - running
      - succeeded
      - failed
      - dead
      - cancelled
      - discarded
    Job:
      type: object
      description: A background job. Jobs report failures with the same code vocabulary as the HTTP API
        (see `contracts/errors.md` section 6).
      required:
      - id
      - type
      - state
      - attempts
      - max_attempts
      - created_at
      - updated_at
      properties:
        id:
          type: string
        type:
          type: string
          description: Job type, for example `import_commit` or `payroll_calculate`.
        state:
          $ref: '#/components/schemas/JobStatus'
        attempts:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        last_error_at:
          type: string
          format: date-time
        error_code:
          type: string
          description: A code from the shared code list in `contracts/errors.md`.
        error_message:
          type: string
          description: Safe to display. Never contains internals.
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
    AuthLoginRequest:
      type: object
      description: Credentials. The response is identical for an unknown username and a wrong password;
        the API never enumerates users.
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
    AuthLoginResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - role
      - must_change_password
      properties:
        access_token:
          type: string
          description: 'JWT access token. Send as `Authorization: Bearer <token>`.'
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
        role:
          type: string
          description: Role granted to the account.
        must_change_password:
          type: boolean
          description: True when the account still has to set its own password. The token is valid but
            privileged calls return 401 `password_change_required`.
        refresh_token:
          type: string
          description: Refresh token, issued when refresh token rotation is enabled. Presented to `POST
            /auth/refresh`, never to any other endpoint.
    AuthRefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    AuthRefreshResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          minimum: 1
        refresh_token:
          type: string
          description: The rotated refresh token. The presented token is invalidated. If an already rotated
            token is presented again the whole token family is revoked and the response is 401 `refresh_token_reused`.
    AuthLogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional refresh token to revoke. Without it only the presented access token is
            invalidated.
    AuthLogoutResponse:
      type: object
      required:
      - revoked
      properties:
        revoked:
          type: boolean
          description: True when the access token and any supplied refresh token were revoked.
    AuthUser:
      type: object
      description: A user account of this deployment.
      required:
      - id
      - username
      - role
      - is_active
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          description: Role held by the account.
        is_active:
          type: boolean
          description: A disabled account cannot authenticate.
        must_change_password:
          type: boolean
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    AuthUserCreateRequest:
      type: object
      required:
      - username
      - email
      - password
      - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Must satisfy the deployment password policy. A rejected password returns 422 `password_policy_violation`;
            a password on the local breached list returns 422 `password_breached`.
        role:
          type: string
          description: Role to grant. Only an administrator may call this endpoint.
        send_invite:
          type: boolean
          default: true
          description: When true the account is created with `must_change_password` set and no password
            is delivered to the user.
    AuthUserUpdateRequest:
      type: object
      description: Partial update. `role` changes are audited; setting `is_active` to false revokes every
        live session of that account.
      properties:
        email:
          type: string
          format: email
        role:
          type: string
        is_active:
          type: boolean
    AuthUserPasswordRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          format: password
          description: The administrator sets the initial password. The account is marked `must_change_password`
            and cannot act until it is changed.
    AuthPasswordChangeRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          description: Must satisfy the password policy and must not repeat one of the last N passwords.
            Failures return 422 `password_policy_violation`, `password_reuse` or `password_breached`.
    AuthPasswordChangeResponse:
      type: object
      required:
      - changed
      properties:
        changed:
          type: boolean
        sessions_revoked:
          type: boolean
          description: True when all other sessions of the account were revoked.
    AuthMfaEnrollResponse:
      type: object
      description: TOTP enrolment material. The shared secret is returned exactly once, at enrolment time.
        It is never shown again and never included in any later response.
      required:
      - secret
      - otpauth_uri
      properties:
        secret:
          type: string
          description: Base32 TOTP shared secret. Shown once.
        otpauth_uri:
          type: string
          description: The `otpauth://` URI to scan into an authenticator app.
        digits:
          type: integer
          default: 6
        period:
          type: integer
          default: 30
          description: TOTP time step in seconds.
        algorithm:
          type: string
          default: SHA1
    AuthMfaConfirmRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 10
          description: The current TOTP code. A wrong code returns 422 `mfa_invalid_code`.
    AuthMfaDisableRequest:
      type: object
      required:
      - recovery_code
      properties:
        recovery_code:
          type: string
          minLength: 1
          description: One unused recovery code. A wrong code returns 422 `mfa_recovery_code_invalid`
            and MFA stays enabled.
    AuthRecoveryCodesResponse:
      type: object
      description: Fresh recovery codes. The plaintext is returned exactly once, at generation time, and
        is not recoverable afterwards.
      required:
      - codes
      - generated_at
      properties:
        codes:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
    Employee:
      type: object
      description: 'An employee record of this deployment, as the record is stored. The employee number
        is a string business key (`employee_id`); `id` is the database identity. `email` is the address
        as stored and is not re-validated on the way out: a row written by an import or an older release
        must not take the directory down. The record has no position, location, employment type, termination
        date or effective-dated history yet; those are separate capabilities, not fields this schema can
        promise.'
      required:
      - id
      - employee_id
      - first_name
      - last_name
      - email
      - hire_date
      - job_id
      - department_id
      - status
      properties:
        id:
          type: integer
        employee_id:
          type: string
          description: Stable business key. Unique inside the deployment.
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          description: The address as stored.
        phone:
          type: string
          nullable: true
        hire_date:
          type: string
          format: date
        job_id:
          type: integer
        department_id:
          type: integer
        manager_id:
          type: integer
          nullable: true
        status:
          type: string
          description: The stored employment status. The deployment writes `Active`, `On Leave`, `Terminated`
            and `Rehired`; the value is not constrained on the way out, so a row written by an import
            or an older release is still returned.
        employment_type:
          type: string
          nullable: true
          description: Full-time, Part-time, Contract or Intern.
        termination_date:
          type: string
          format: date
          nullable: true
          description: Set when the employee moved to `Terminated`, cleared by `Rehired`.
        salary:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
    EmployeeCreate:
      type: object
      description: The body `POST /employees` accepts. The employee number is required and is supplied
        by the caller; the deployment does not allocate one.
      required:
      - employee_id
      - first_name
      - last_name
      - email
      - hire_date
      - job_id
      - department_id
      properties:
        employee_id:
          type: string
          description: The employee number. A duplicate returns 409 `duplicate_natural_key`.
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        hire_date:
          type: string
          format: date
        job_id:
          type: integer
        department_id:
          type: integer
        manager_id:
          type: integer
          nullable: true
        status:
          type: string
          default: Active
          description: The stored employment status, for example `Active`.
        employment_type:
          type: string
          nullable: true
          description: Full-time, Part-time, Contract or Intern.
        salary:
          type: number
          nullable: true
    EmployeeUpdate:
      type: object
      description: 'Partial update of the stored record. Only the fields sent are changed. There is no
        effective date or reason yet: the effective-dated history is a separate, unimplemented capability
        (`HR-03`), and pretending the field existed would be worse than its absence.'
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        hire_date:
          type: string
          format: date
        job_id:
          type: integer
        department_id:
          type: integer
        manager_id:
          type: integer
          nullable: true
        status:
          type: string
          description: The next employment status. The lifecycle is enforced; an undefined move returns
            409 `invalid_state_transition`.
        employment_type:
          type: string
          nullable: true
          description: Full-time, Part-time, Contract or Intern.
        salary:
          type: number
          nullable: true
        effective_from:
          type: string
          format: date
          description: First day the change is in force. Defaults to today. A future date is refused with
            422 because the deployment has no scheduler.
        reason:
          type: string
          maxLength: 500
          nullable: true
          description: Why the change was made; stored on every history row it produces.
    EmployeeHistoryEntry:
      type: object
      description: One effective dated change to the employment record. History is append only; a row
        is closed with `effective_to` when a newer change supersedes it.
      required:
      - id
      - field
      - effective_from
      - changed_at
      properties:
        id:
          type: integer
        field:
          type: string
          description: The field that changed, for example `status` or `manager_id`.
        previous_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true
        changed_by:
          type: string
          nullable: true
          description: Username of the actor that made the change.
        changed_at:
          type: string
          format: date-time
    EmployeeDocument:
      type: object
      description: A document attached to an employee. The file itself is not returned by this endpoint;
        only its metadata.
      required:
      - id
      - employee_id
      - filename
      - uploaded_at
      properties:
        id:
          type: string
        employee_id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        category:
          type: string
          description: Free classification, for example `contract` or `id_proof`.
        checksum:
          type: string
          description: SHA-256 of the stored object.
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          type: string
    EmployeeDocumentUpload:
      type: object
      description: The parts of a document upload. The `file` part carries the bytes, the other parts
        carry the metadata.
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: The document. The accepted file types and the size limit are deployment settings,
            reported by the configuration assistant.
        category:
          type: string
          description: Free classification, for example `contract` or `id_proof`.
        description:
          type: string
          maxLength: 500
        effective_from:
          type: string
          format: date
          description: Date the document takes effect from.
    OrgChartNode:
      type: object
      description: A node of the reporting tree.
      required:
      - employee_id
      - name
      properties:
        employee_id:
          type: string
        name:
          type: string
          description: Display name of the employee. Not a credential.
        position_id:
          type: string
          nullable: true
        department_id:
          type: string
          nullable: true
        manager_id:
          type: string
          nullable: true
        direct_reports:
          type: array
          items:
            $ref: '#/components/schemas/OrgChartNode'
    TimeEntry:
      type: object
      description: A single recorded working period.
      required:
      - id
      - employee_id
      - work_date
      - minutes
      properties:
        id:
          type: string
        employee_id:
          type: string
        work_date:
          type: string
          format: date
        clock_in:
          type: string
          format: date-time
          nullable: true
        clock_out:
          type: string
          format: date-time
          nullable: true
        minutes:
          type: integer
          description: Worked minutes, already reduced by breaks.
        break_minutes:
          type: integer
          minimum: 0
        source:
          type: string
          enum:
          - terminal
          - mobile
          - manual
          - import
          - correction
        status:
          type: string
          enum:
          - open
          - complete
          - approved
          - rejected
        shift_template_id:
          type: string
          nullable: true
        roster_entry_id:
          type: string
          nullable: true
          description: Link to the roster entry this time entry was created from (if any).
    ClockInRequest:
      type: object
      description: Starts a working period. When `employee_id` is omitted the clock in is attributed to
        the caller.
      properties:
        employee_id:
          type: string
          description: Only an administrator or manager may clock in on behalf of someone else.
        location_id:
          type: string
        source:
          type: string
          default: terminal
          enum:
          - terminal
          - mobile
          - manual
          - import
          - correction
        device_id:
          type: string
        notes:
          type: string
          maxLength: 500
    ClockOutRequest:
      type: object
      description: Closes the open working period of the caller, or of `employee_id` when an administrator
        or manager clocks someone out.
      properties:
        employee_id:
          type: string
        entry_id:
          type: string
          description: Explicit entry to close. Defaults to the open entry of the employee.
        source:
          type: string
          default: terminal
          enum:
          - terminal
          - mobile
          - manual
          - import
          - correction
        notes:
          type: string
          maxLength: 500
    Timesheet:
      type: object
      description: The timesheet of one employee for one period. A period that is locked by a payroll
        cut off returns 409 `timesheet_locked`.
      required:
      - id
      - employee_id
      - period_start
      - period_end
      - status
      properties:
        id:
          type: string
        employee_id:
          type: string
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        status:
          type: string
          enum:
          - open
          - submitted
          - approved
          - rejected
          - locked
        total_minutes:
          type: integer
          minimum: 0
        overtime_minutes:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetLine'
        submitted_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          type: string
          nullable: true
    TimesheetLine:
      type: object
      required:
      - entry_id
      - work_date
      - minutes
      properties:
        entry_id:
          type: string
        work_date:
          type: string
          format: date
        minutes:
          type: integer
          minimum: 0
        source:
          type: string
    EntryCorrectionRequest:
      type: object
      description: 'A manual correction of a recorded working period. A correction is never applied directly:
        it is recorded as a pending request and the entry keeps its original value until a manager approves
        it.'
      required:
      - reason
      properties:
        work_date:
          type: string
          format: date
        clock_in:
          type: string
          format: date-time
        clock_out:
          type: string
          format: date-time
        minutes:
          type: integer
          minimum: 0
          description: Total worked minutes after correction.
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: Why the correction is needed. Stored on the audit trail.
    WorkingTimeViolation:
      type: object
      description: A detected breach of the configured working time rules, for example a missing break
        or a daily maximum overrun.
      required:
      - id
      - employee_id
      - work_date
      - kind
      - severity
      properties:
        id:
          type: string
        employee_id:
          type: string
        work_date:
          type: string
          format: date
        kind:
          type: string
          description: Machine readable violation kind, for example `missing_break` or `max_daily_exceeded`.
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        minutes:
          type: integer
          description: Minutes involved in the violation.
        detected_at:
          type: string
          format: date-time
        resolved:
          type: boolean
    LeaveType:
      type: object
      description: A leave type configured for this deployment.
      required:
      - id
      - code
      - name
      - unit
      properties:
        id:
          type: string
        code:
          type: string
          description: Stable code used in imports and exports.
        name:
          type: string
        unit:
          type: string
          enum:
          - days
          - hours
        accrual_method:
          type: string
          enum:
          - none
          - annual
          - per_period
          - seniority
        requires_approval:
          type: boolean
        max_consecutive_days:
          type: integer
          nullable: true
        active:
          type: boolean
    LeaveBalance:
      type: object
      description: The leave balance of one employee for one leave type and one year. Balances are derived
        from the ledger; the numbers here are the projection at the reporting date.
      required:
      - employee_id
      - leave_type_id
      - year
      - entitled
      - available
      properties:
        employee_id:
          type: string
        leave_type_id:
          type: string
        leave_type_code:
          type: string
        year:
          type: integer
        entitled:
          type: number
        taken:
          type: number
        pending:
          type: number
        available:
          type: number
        as_of:
          type: string
          format: date
          description: Date the balance was computed.
    LeaveLedgerEntry:
      type: object
      description: 'One immutable movement of a leave balance. The ledger is the history of the balance;
        the balance itself is the sum of the movements. A row is never edited and never deleted: a correcting
        movement is appended and references the row it corrects. The ledger carries no reason and no diagnosis
        — the reason for a leave stays on the leave request.'
      required:
      - id
      - balance_id
      - employee_id
      - leave_type_id
      - entitlement_year
      - entry_type
      - signed_days
      - running_balance
      - source
      properties:
        id:
          type: string
        balance_id:
          type: string
          description: The balance the movement belongs to.
        employee_id:
          type: string
        leave_type_id:
          type: string
        entitlement_year:
          type: integer
        entry_type:
          type: string
          enum:
          - accrual
          - entitlement
          - carry_over
          - usage
          - adjustment
          - expiry
          - encashment
          description: The kind of movement. The sign is in `signed_days`; a usage that was reversed is
            a usage with the other sign.
        signed_days:
          type: number
          description: The movement in days. Positive when the days come to the balance, negative when
            they go from it.
        reference_type:
          type: string
          nullable: true
          description: What the movement refers to, when it refers to something.
        reference_id:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: What the movement was. Never the reason for the leave, and never anything about
            the person's health.
        created_at:
          type: string
          format: date-time
          nullable: true
        running_balance:
          type: number
          description: Balance after this movement was applied.
        source:
          type: string
          enum:
          - policy
          - request
          - manual
          - payroll
    LeaveRequest:
      type: object
      description: A leave request and its decision state.
      required:
      - id
      - employee_id
      - leave_type_id
      - start_date
      - end_date
      - status
      properties:
        id:
          type: string
        employee_id:
          type: string
        leave_type_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        quantity:
          type: number
        unit:
          type: string
          enum:
          - days
          - hours
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by:
          type: string
          nullable: true
        decision_note:
          type: string
          nullable: true
    LeaveRequestCreate:
      type: object
      required:
      - leave_type_id
      - start_date
      - end_date
      properties:
        leave_type_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        quantity:
          type: number
          description: Optional. When omitted the server derives the quantity from the leave calendar
            of the employee.
        reason:
          type: string
          maxLength: 500
        half_day:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 1000
    LeaveReconciliationRow:
      type: object
      description: One leave balance, read against the ledger that should explain it. The row carries
        the numbers that disagree and nothing else.
      required:
      - balance_id
      - employee_id
      - leave_type_id
      - entitlement_year
      - cached_available_days
      - ledger_available_days
      - difference_days
      - state
      properties:
        balance_id:
          type: string
        employee_id:
          type: string
        leave_type_id:
          type: string
        leave_type_name:
          type: string
          nullable: true
        entitlement_year:
          type: integer
        cached_entitled_days:
          type: number
        cached_carried_over_days:
          type: number
        cached_used_days:
          type: number
        cached_available_days:
          type: number
          description: What the balance's own columns add up to.
        ledger_available_days:
          type: number
          description: What the ledger adds up to. This is the balance.
        difference_days:
          type: number
          description: The ledger minus the cache. Zero when they agree.
        ledger_entries:
          type: integer
          description: How many rows the ledger holds for this balance.
        state:
          type: string
          enum:
          - in_sync
          - out_of_sync
          - no_ledger
          description: '`no_ledger` is a balance that has no history yet; `out_of_sync` is a balance whose
            history and whose cache disagree.'
    LeaveReconciliationSummary:
      type: object
      description: What the reconciliation found, in one line of numbers.
      required:
      - balances
      - in_sync
      - out_of_sync
