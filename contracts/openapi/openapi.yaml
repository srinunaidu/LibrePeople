    RosterEntry:
      type: object
      description: One assigned shift in a roster version.
      required:
      - id
      - employee_id
      - shift_template_id
      - work_date
      properties:
        id:
          type: string
        roster_version_id:
          type: string
        employee_id:
          type: string
        shift_template_id:
          type: string
        work_date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        minutes:
          type: integer
        status:
          type: string
          enum:
          - draft
          - published
          - locked
    RosterGenerateRequest:
      type: object
      description: 'The input of the roster solver: how many people are needed, what must hold, and how
        the solver should trade the objectives off. A request that contradicts itself returns 422 `validation_error`.'
      required:
      - start_date
      - end_date
      - location_id
      - demand
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        location_id:
          type: string
        demand:
          type: array
          minItems: 1
          description: Required headcount per shift template and date.
          items:
            type: object
            required:
            - shift_template_id
            - required_headcount
            properties:
              shift_template_id:
                type: string
              work_date:
                type: string
                format: date
                description: Optional. When omitted the demand applies to every date in the range.
              required_headcount:
                type: integer
                minimum: 0
        constraints:
          type: object
          description: Hard constraints. The solver never breaks these; when they cannot all hold the
            response carries unfilled slots and their causes.
          properties:
            max_shifts_per_employee:
              type: integer
              minimum: 0
            max_weekly_hours:
              type: number
              minimum: 0
            min_rest_minutes:
              type: integer
              minimum: 0
            required_skills:
              type: array
              items:
                type: string
            exclude_employees:
              type: array
              items:
                type: string
            respect_leave:
              type: boolean
              default: true
              description: Do not assign an employee who is on approved leave.
        weights:
          type: object
          description: Relative weight of each objective. The solver minimises the weighted sum. A weight
            of zero removes the objective.
          properties:
            labour_cost:
              type: number
              minimum: 0
            fairness:
              type: number
              minimum: 0
            preference:
              type: number
              minimum: 0
            overtime:
              type: number
              minimum: 0
        time_limit_seconds:
          type: integer
          minimum: 1
          default: 30
          description: Solver time limit. Exceeding it returns 503 `solver_timeout` with the unmet slot
            list.
    RosterGenerateResponse:
      type: object
      description: A candidate roster plus everything the solver could not fill. The candidate is not
        live until it is published.
      required:
      - roster_version_id
      - candidates
      - unfilled
      - solver
      properties:
        roster_version_id:
          type: string
          description: Version the candidates belong to. The version stays in `draft`.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RosterEntry'
        unfilled:
          type: array
          items:
            $ref: '#/components/schemas/UnfilledSlot'
        solver:
          $ref: '#/components/schemas/SolverMetadata'
        warnings:
          type: array
          items:
            type: string
    UnfilledSlot:
      type: object
      description: An unfilled slot with its cause.
      required:
      - slot_id
      - date
      - headcount
      - cause
      properties:
        slot_id:
          type: string
        date:
          type: string
          format: date
        location:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        headcount:
          type: integer
        cause:
          type: string
        blocking_constraint:
          type: string
          nullable: true
        constraint:
          type: string
          nullable: true
    SolverMetadata:
      type: object
      description: How the candidate roster was produced. Recorded so a planner can judge the result and
        reproduce it later.
      required:
      - solver
      - status
      properties:
        solver:
          type: string
          description: Solver engine and version that produced the result.
        status:
          type: string
          enum:
          - optimal
          - feasible
          - timeout
          - infeasible
        time_limit_seconds:
          type: integer
        solve_time_ms:
          type: integer
        objective_value:
          type: number
          description: Value of the weighted objective the solver minimised.
        evaluated_nodes:
          type: integer
        input_hash:
          type: string
          description: Hash of the solver input, so the same input gives the same result.
    RosterPublishRequest:
      type: object
      required:
      - roster_version_id
      properties:
        roster_version_id:
          type: string
        publish_at:
          type: string
          format: date-time
          description: Optional. Publish now when omitted.
        notify:
          type: boolean
          default: true
          description: Notify the affected employees after publishing.
    RosterVersion:
      type: object
      description: A version of the roster for one location and one date range.
      required:
      - id
      - location_id
      - start_date
      - end_date
      - status
      properties:
        id:
          type: string
        location_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum:
          - draft
          - published
          - superseded
        entry_count:
          type: integer
          minimum: 0
        unfilled_count:
          type: integer
          minimum: 0
        published_at:
          type: string
          format: date-time
          nullable: true
        published_by:
          type: string
          nullable: true
    CoverageResponse:
      type: object
      description: Coverage of the demand for a location and a period, with the gaps that remain.
