    post:
      operationId: schedulingGenerateRoster
      tags:
      - scheduling
      security:
      - bearerAuth: []
      summary: Produce a candidate roster
      description: 'Runs the solver over the demand, the constraints and the weights and returns a candidate
        roster, the slots it could not fill and the metadata of the run. The candidate is a draft: it
        changes nothing until the version is published. A request whose demand and constraints contradict
        each other returns 422 `validation_error`; a request the solver cannot satisfy at all returns
        422 `solver_infeasible`; a run that hits the time limit returns 503 `solver_timeout` with the
        list of the unmet slots.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RosterGenerateRequest'
      responses:
        '200':
          description: The candidate roster and the solver metadata.
