  /forecasting/accuracy:
    get:
      operationId: forecastingListAccuracy
      tags:
      - forecasting
      security:
      - bearerAuth: []
      summary: Accuracy history over time
      description: 'Returns the forecast-vs-actual accuracy rows, newest first, paged: one per forecast
        run, month period, location and role, each with the model version that produced the forecast,
        the error metrics (MAPE, MAE, bias, sample size) and a confidence status. The window parameters
        filter by the period bucket of the rows. Every row''s confidence status is recomputed for this
        request from its stored MAPE against the thresholds given here (`review_threshold`, default 0.10;
        `degraded_threshold`, default 0.25), so the same history can be read under different thresholds
        without re-syncing. A row whose MAPE could not be computed is never `ok`; it is flagged `review`.'
      x-lifecycle: released
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: start_date
        in: query
        required: false
        description: Only the rows of this period bucket or later (inclusive).
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        description: Only the rows of this period bucket or earlier (inclusive).
        schema:
          type: string
          format: date
      - name: location_id
        in: query
        required: false
        description: Only the rows of this location.
        schema:
          type: integer
      - name: role_id
        in: query
        required: false
        description: Only the rows of this role (job).
        schema:
          type: integer
      - name: model_version
        in: query
        required: false
        description: Only the rows judged against this model version.
        schema:
          type: string
      - name: run_id
        in: query
        required: false
        description: Only the rows of this forecast run.
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: Only the rows whose computed status is this one.
        schema:
          type: string
          enum:
          - ok
          - review
          - degraded
      - name: review_threshold
        in: query
        required: false
        description: The MAPE at or under which a row is `ok`. Default 0.10.
        schema:
          type: number
      - name: degraded_threshold
        in: query
        required: false
        description: The MAPE at or under which a row is `review`. Default 0.25.
        schema:
          type: number
      responses:
        '200':
          description: A page of accuracy rows, newest first.
          content:
            application/json:
              schema:
