  /employees:
    get:
      operationId: employeesList
      tags:
      - employees
      security:
      - bearerAuth: []
      summary: List employees
      description: 'Lists the employees of this deployment, newest hire first. The list is paged with
        `page` and `page_size`, and the answer carries the total number of matching employees in `meta.total`,
        so a client can say how many exist without reading every page. The filters are applied by the
        database, not by the client: `department_id`, `status`, `manager_id` and `search` (case-insensitive
        on the employee number, the first name, the last name, the full name and the email address). Omitting
        `sort` gives newest hire first; naming a `sort` key uses `order`, which defaults to ascending.
        Only employees inside the visibility scope of the caller are counted and returned.

        There is no location filter: the deployment''s employee record has no location. A position carries
        a location, and an employee is not linked to a position yet; that arrives with the employment
        record work, and the filter will be declared then rather than accepted now and silently ignored.'
