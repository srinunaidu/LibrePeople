                      type: string
                  aliases_used:
                    type: object
                    additionalProperties:
                      type: string
                    description: The headers that were written in an alternative spelling, and the column
                      each one resolved to.
                  file_hash:
                    type: string
                    description: Hash of the uploaded bytes.
                  result_hash:
                    type: string
                    description: 'Hash of the outcome. The confirmation token is bound to it, and the
