openapi: 3.1.0
info:
  title: Karmathy HCM API
  version: 1.0.0
  description: "The contract of the Karmathy HCM API.\n\nKarmathy is deployed once per customer. One deployment\
    \ holds exactly one\ncustomer's data in exactly one Oracle schema, and there is no cross tenant\n\
    querying anywhere in this API: a caller only ever sees the records of the\ndeployment it is talking\
    \ to. Because of that, no endpoint takes a tenant\nparameter.\n\nAuthentication is a bearer token\
    \ issued by `POST /auth/login`. Every\noperation except `authLogin` and `authRefresh` requires\n`Authorization:\
    \ Bearer <access_token>`.\n\nEvery error response uses the one envelope of `contracts/errors.md`:\n\
    \n    {\"error\": {\"code\": ..., \"category\": ..., \"message\": ...,\n               \"retryable\"\
    : ..., \"details\": {...}, \"request_id\": ...}}\n\nClients branch on `error.code` and never on `error.message`.\n\
    \nThis document is the authority for what the API *promises*. The running\napplication publishes its\
    \ own generated document at\n`GET /api/v1/openapi.json`, which is the authority for what the code\n\
    *does* today. `scripts/check_openapi_drift.py` compares the two.\n"
  x-generated-by: scripts/merge_openapi.py
servers:
- url: /api/v1
  description: Deployment local API root. One deployment serves one customer out of one Oracle schema.
tags:
- name: admin
  description: 'The operation of this deployment, for administrators only: the background jobs and the
    dead letter view, the audit log and the verification of its hash chain, the retention schedules, the
    erasure requests, the data subject access exports and the rule packs. Every call in this domain is
    written to the audit log.'
- name: auth
  description: Authentication, session management, second factor and user accounts of this deployment.
    The only public operation in the whole contract is `POST /auth/login`; `POST /auth/refresh` is public
    as well because it authenticates with a refresh token instead of an access token.
- name: benefits
  description: benefits domain endpoints.
- name: compliance
  description: compliance domain endpoints.
- name: core-hr
  description: core-hr domain endpoints.
- name: data-quality
  description: data-quality domain endpoints.
- name: departments
  description: departments domain endpoints.
- name: employees
  description: 'The employee master data of this deployment: the record itself, the effective dated employment
    history, the documents attached to an employee and the reporting structure. Reads are limited to the
    visibility scope of the caller; a record outside that scope is reported as 404, never as 403.'
- name: ess
  description: ess domain endpoints.
- name: forecasting
  description: 'Forecasting of this deployment: the runs, the method that was used, the window it was
    fitted on, the measured error on a holdout and the scenarios that are compared against each other.
    A run that had less history than its method needs is still recorded, but it is flagged `insufficient_history`
    and carries no forecast values. The assumptions of a scenario are always shown, never applied silently.'
- name: imports
  description: 'Bulk import of this deployment. Two flows are described here. The entity-based flow is
    what the application serves today: the file names an entity, the importer validates it against that
    entity''s contract, and the operator reads the counts and the row errors before committing. The upload-based
    flow is the planned, job-backed import, in which the file is uploaded first and the work happens in
    the background. The exact columns each entity expects are in `docs/IMPORT_TEMPLATES.md` and at `GET
    /import-export/columns/{entity}`.'
- name: learning
  description: learning domain endpoints.
- name: leave
  description: 'Leave of this deployment: the leave types, the balances, the ledger behind the balances,
    the requests and their decisions, and the non working days of the locations. A request that overlaps
    an existing one returns 409 `leave_overlaps_existing`; a request for more leave than the balance allows
    returns 409 `leave_insufficient_balance`.'
- name: offboarding
  description: offboarding domain endpoints.
- name: onboarding
  description: 'The setup of this deployment. The setup is a resumable state machine with seven steps:
    `company_profile`, `business_type`, `modules`, `import`, `roles`, `review` and `launch`. Every step
    can be submitted again and the state records what is done and what is next. The configuration assistant
    reports what is still missing or inconsistent, and each of its findings can be fixed from here. The
    launch is idempotent: launching a deployment that is already launched does nothing and says so.'
- name: onboarding-portal
  description: onboarding-portal domain endpoints.
- name: payroll
  description: 'Payroll of this deployment: the pay components and profiles, the pay runs from draft to
    finalised, the reconciliation of a run, the payslips and the payment file. A run may only be calculated
    when the rule pack of its jurisdiction is `verified`; otherwise the calculation is refused with 409
    `rule_pack_not_verified` and nothing is computed and nothing is written. The statutory values themselves
    belong to the customer''s rule packs; the platform does not ship them.'
- name: performance
  description: performance domain endpoints.
- name: platform
  description: platform domain endpoints.
- name: public
  description: The unauthenticated door of the marketing site. It carries no tenant parameter and no employee
    reference, it accepts a closed set of fields, and it is rate limited because it is the one operation
    in the product that anybody on the internet may call.
- name: recruiting
  description: recruiting domain endpoints.
- name: reports
  description: reports domain endpoints.
- name: scheduling
  description: 'Shift planning of this deployment: the shift templates, the roster, the solver that produces
    a candidate roster, the versions of a published roster, the coverage against the demand and the shift
    swaps. A candidate roster is not live until it is published, and publishing re-checks every hard constraint.'
- name: time
  description: 'Working time of this deployment: clock in and clock out, the recorded entries, the timesheets
    that are submitted and approved, the manual corrections and the detected breaches of the working time
    rules. A period that a payroll cut off has locked returns 409 `timesheet_locked` and no entry in it
    can be changed.'
security:
- bearerAuth: []
paths:
  /admin/audit:
    get:
      operationId: adminListAudit
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Read the audit log
      description: 'Reads the audit log of this deployment, newest first. The list is paged; `page` and
        `page_size` control the window. `action`, `entity_type`, `entity_id`, `actor` and `from`/`to`
        narrow it down. Every entry carries the hash of the previous entry, so the log is a chain: a removed
        or edited row breaks the chain at that point. The chain can be checked with `GET /admin/audit/verify`.'
      x-lifecycle: planned
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: action
        in: query
        required: false
        description: Only the entries with this action, for example `leave.approve`.
        schema:
          type: string
      - name: entity_type
        in: query
        required: false
        description: Only the entries about this entity type.
        schema:
          type: string
      - name: entity_id
        in: query
        required: false
        description: Only the entries about this entity.
        schema:
          type: string
      - name: actor
        in: query
        required: false
        description: Only the entries written by this user.
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Only the entries from this moment on.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Only the entries up to this moment.
        schema:
          type: string
          format: date-time
      - name: verify
        in: query
        required: false
        description: Also report whether the chain still holds. The verification result is reported in
          `meta` and does not change the entries that are returned.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntries'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/audit/verify:
    get:
      operationId: adminVerifyAudit
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Verify the audit chain
      description: 'Walks the audit chain of this deployment and checks that every entry still hashes
        to the value it carries, including the hash of the entry before it. The response says whether
        the chain holds and how many entries were checked. When it does not hold, the first broken link
        is reported with its position and the reason, for `hash_mismatch` (an entry was edited), `missing_predecessor`
        (an entry was inserted, removed or reordered in the middle) or `head_mismatch` (entries were removed
        from the end, or the head was rewritten). Record the pair `checked_entries` and `head` outside
        the database: a chain rebuilt from the first entry is internally consistent, and only an external
        anchor detects that. The verification''s own audit entry becomes the next head, as any audited
        action does, so the pair is the anchor. The verification is read only: it never repairs the chain.
        It walks every entry and is not paged, because verifying part of a chain would let the caller
        believe the whole holds. The call itself is audited.'
      x-lifecycle: released
      responses:
        '200':
          description: The result of the verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/dsar-exports:
    get:
      operationId: adminListDsarExports
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: List the data subject access exports
      description: Lists the data subject access exports of this deployment, newest first. The list is
        paged; `page` and `page_size` control the window. `status` and `subject_type` narrow it down.
        The download URL of a ready export is short lived; it is not part of the list entry.
      x-lifecycle: planned
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: status
        in: query
        required: false
        description: Only the exports in this state.
        schema:
          type: string
          enum:
          - queued
          - building
          - ready
          - expired
          - failed
      - name: subject_type
        in: query
        required: false
        description: Only the exports about this kind of subject.
        schema:
          type: string
          enum:
          - employee
          - applicant
          - contractor
      responses:
        '200':
          description: A page of exports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDsarExports'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: adminCreateDsarExport
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Start a data subject access export
      description: Starts building the export of everything the platform holds about one subject. The
        work is done by a background job; the export is ready for download when the job has finished.
        A subject that does not exist returns 404 `employee_not_found`. The export is written to the object
        storage with a short lived URL and it expires.
      x-lifecycle: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarExportCreate'
      responses:
        '201':
          description: The export was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/erasure-requests:
    get:
      operationId: adminListErasureRequests
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: List the erasure requests
      description: Lists the erasure requests of this deployment, newest first. The list is paged; `page`
        and `page_size` control the window. `status` and `subject_type` narrow it down. A request that
        is being processed is held by a background job.
      x-lifecycle: planned
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: status
        in: query
        required: false
        description: Only the requests in this state.
        schema:
          type: string
          enum:
          - open
          - processing
          - completed
          - rejected
      - name: subject_type
        in: query
        required: false
        description: Only the requests about this kind of subject.
        schema:
          type: string
          enum:
          - employee
          - applicant
          - contractor
      responses:
        '200':
          description: A page of erasure requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedErasureRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: adminCreateErasureRequest
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: File an erasure request
      description: 'Files a request to erase the personal data of one subject. The work is done by a background
        job. Records that are under a legal hold are not erased: they are reported in the job result and
        the request stays open. A subject that does not exist returns 404 `employee_not_found`; a request
        without the legal basis it needs returns 422 `validation_error`.'
      x-lifecycle: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureRequestCreate'
      responses:
        '201':
          description: The erasure request was filed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/jobs:
    get:
      operationId: adminListJobs
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: List the background jobs
      description: 'Lists the background jobs of this deployment, newest first. The list is paged; `page`
        and `page_size` control the window. `state` narrows it to one lifecycle state and `type` to one
        job type. A job that exhausted its attempts is in the `dead` state and stays visible here: a dead
        job is never silently discarded.'
      x-lifecycle: released
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: state
        in: query
        required: false
        description: Only the jobs in this state.
        schema:
          type: string
          enum:
          - pending
          - running
          - succeeded
          - failed
          - dead
          - cancelled
          - discarded
      - name: type
        in: query
        required: false
        description: Only the jobs of this type.
        schema:
          type: string
      - name: include_payload
        in: query
        required: false
        description: Include the stored input of the job. Off by default, because the input can carry
          a confirmation token — an authorisation. The stored `result` is served by every read either
          way.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of background jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/jobs/{job_id}:
    get:
      operationId: adminGetJob
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Read one background job
      description: Returns one background job with its state, its attempt count and, when it failed, the
        error it failed with. The error of a job uses the same code vocabulary as the HTTP API, so a client
        can branch on it. `result` is the stored output of a finished job; it is `null` when the job stored
        none, which is a different fact from an empty result. The stored input is not returned here unless
        `include_payload=true` is passed, because it can carry a confirmation token. A job that does not
        exist returns 404 `job_not_found`.
      x-lifecycle: released
      parameters:
      - name: job_id
        in: path
        required: true
        description: Identifier of the job.
        schema:
          type: string
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/jobs/{job_id}/discard:
    post:
      operationId: adminDiscardJob
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Discard a background job
      description: 'Marks a job as discarded so that it is not picked up again. The record of the job
        is kept: discarding removes the work, never the evidence. A job that is still running returns
        409 `invalid_state_transition`. The discard is written to the audit log with the reason.'
      x-lifecycle: released
      parameters:
      - name: job_id
        in: path
        required: true
        description: Identifier of the job.
        schema:
          type: string
      - name: reason
        in: query
        required: false
        description: Why the job is discarded. Stored on the audit log.
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: The job was discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/jobs/{job_id}/retry:
    post:
      operationId: adminRetryJob
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Retry a background job
      description: Puts a failed or dead job back into the queue. The attempt counter is not reset, so
        the configured maximum still applies. A job that is still running returns 409 `invalid_state_transition`;
        a job that another worker has already taken over returns 409 `lease_lost`. Retrying a job that
        has already succeeded is a no op.
      x-lifecycle: released
      parameters:
      - name: job_id
        in: path
        required: true
        description: Identifier of the job.
        schema:
          type: string
      responses:
        '202':
          description: The job was put back into the queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/retention:
    get:
      operationId: adminGetRetention
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Read the retention schedules
      description: 'Returns the retention schedule of every entity of this deployment: how long the records
        are kept, what happens to them afterwards and whether a legal hold is in place. The schedule is
        the customer policy: the platform does not impose statutory retention values of its own. While
        a hold is in place the schedule does not run.'
      x-lifecycle: planned
      responses:
        '200':
          description: The retention schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetentionSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    patch:
      operationId: adminUpdateRetention
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Change a retention schedule
      description: Changes the schedule of one entity. The change is written to the audit log with the
        old and the new value. A schedule for an entity the deployment does not have returns 404 `record_not_found`;
        a retention period that is not a positive number of days returns 422 `validation_error`. A legal
        hold can only be lifted by an administrator with the compliance role.
      x-lifecycle: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionScheduleUpdate'
      responses:
        '200':
          description: The updated schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/rule-packs:
    get:
      operationId: adminListRulePacks
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: List the rule packs
      description: 'Lists the rule packs of this deployment: the versioned rule sets of the jurisdictions,
        with their status, where they came from, how they were verified and how they were signed. A pack
        is only usable for a payroll run when its status is `verified`. The list is paged; `page` and
        `page_size` control the window.'
      x-lifecycle: planned
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - name: jurisdiction
        in: query
        required: false
        description: Only the packs of this jurisdiction.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only the packs in this state.
        schema:
          type: string
          enum:
          - draft
          - verified
          - deprecated
          - rejected
      responses:
        '200':
          description: A page of rule packs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRulePacks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/rule-packs/{pack_id}:
    get:
      operationId: adminGetRulePack
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Read one rule pack
      description: Returns one rule pack with its status, its source, the checks of its verification and
        the signature it carries. A pack that does not exist returns 404 `rule_pack_not_found`. A pack
        that fails its own load returns 503 `rule_pack_loader_failure` with the reason.
      x-lifecycle: planned
      parameters:
      - name: pack_id
        in: path
        required: true
        description: Identifier of the rule pack.
        schema:
          type: string
      responses:
        '200':
          description: The rule pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /admin/status:
    get:
      operationId: adminGetStatus
      tags:
      - admin
      security:
      - bearerAuth: []
      summary: Read the operational status
      description: 'Returns the operational status of this deployment for administrators: the upgrade
