              $ref: '#/components/schemas/RosterEntry'
          problem:
            type: object
          result:
            type: object
          assignments:
            type: array
            items:
              type: object
          unfilled_slots:
            type: array
            items:
              $ref: '#/components/schemas/UnfilledSlot'
          weight_breakdown:
            $ref: '#/components/schemas/WeightBreakdown'
          objective_value:
            type: number
            nullable: true
