  LeaveReference:
    type: object
    description: The leave request behind a run of blocked days, quantified.
    required:
      - leave_request_id
      - leave_type_id
      - start_date
      - end_date
      - days
    properties:
      leave_request_id:
        type: integer
      leave_type_id:
        type: integer
      leave_type_code:
        type: string
        nullable: true
      start_date:
        type: string
        format: date
      end_date:
        type: string
        format: date
      days:
        type: integer
        minimum: 1

  EmployeeAvailability:
    type: object
    description: Per-employee availability over the queried window.
    required:
      - employee_id
      - available_dates
      - unavailable_dates
      - leave_requests
    properties:
      employee_id:
        type: integer
      available_dates:
        type: array
        items:
          type: string
          format: date
      unavailable_dates:
        type: array
        items:
          $ref: '#/components/schemas/LeaveBlockedDay'
      leave_requests:
        type: array
        items:
          $ref: '#/components/schemas/LeaveReference'

  AvailabilityResponse:
    type: object
    description: >-
      Availability for the queried window: approved leave subtracted, every
