      - input_hash
    properties:
      draft_id:
        type: integer
      location_code:
        type: string
        nullable: true
      period_start:
        type: string
        format: date
      period_end:
        type: string
        format: date
      status:
        type: string
      solver_status:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
      problem:
        type: object
      result:
        type: object
      assignments:
        type: array
        items:
          type: object
      roster:
        type: array
        items:
          type: object
      unfilled_slots:
        type: array
        items:
          $ref: '#/components/schemas/UnfilledSlot'
      unfilled:
        type: array
        items:
          $ref: '#/components/schemas/UnfilledSlot'
      weight_breakdown:
