      - period_start
      - period_end
      - deviations
      - summary
    properties:
      version_id:
        type: integer
      location_code:
        type: string
        nullable: true
      period_start:
        type: string
        format: date
      period_end:
        type: string
        format: date
      deviations:
        type: array
        items:
          $ref: '#/components/schemas/DeviationEntry'
      summary:
        type: object
        description: Summary counts by kind and severity.
        additionalProperties:
          type: integer

  LeaveBlockedDay:
    type: object
    description: One day an approved leave request blocks, with the leave reference.
