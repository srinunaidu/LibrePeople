    properties:
      start_date:
        type: string
        format: date
      end_date:
        type: string
        format: date
      employees:
        type: array
        items:
          $ref: '#/components/schemas/EmployeeAvailability'

  RosterDraftOut:
    type: object
    description: Full draft roster data for manager review.
    required:
