      base_version_id:
        type: integer
      added:
        type: array
        items:
          $ref: '#/components/schemas/VersionDiffEntry'
      removed:
        type: array
        items:
          $ref: '#/components/schemas/VersionDiffEntry'
      changed:
        type: array
        items:
          $ref: '#/components/schemas/VersionDiffEntry'
      summary:
        type: object
        additionalProperties:
          type: integer

  VersionDiffEntry:
    type: object
    description: A single entry in a version comparison diff.
    required:
