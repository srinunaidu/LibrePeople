      weights:
        type: object
        additionalProperties:
          type: number

  UnfilledSlot:
    type: object
    description: An unfilled slot with its cause.
    required:
      - slot_id
      - date
      - headcount
      - cause
    properties:
      slot_id:
        type: string
      date:
        type: string
        format: date
      location:
        type: string
        nullable: true
      role:
        type: string
        nullable: true
      headcount:
        type: integer
      cause:
        type: string
      blocking_constraint:
        type: string
        nullable: true
      constraint:
        type: string
        nullable: true

  # --------------------------------------------------------------- payroll --
  PayComponent:
    type: object
    description: One element of a pay profile.
    required:
      - id
      - code
      - name
      - category
    properties:
      id:
        type: string
      code:
        type: string
      name:
        type: string
      category:
        type: string
        enum:
          - earning
          - deduction
          - employer_contribution
      taxable:
        type: boolean
      calculation_type:
        type: string
        enum:
          - fixed
          - percentage
          - formula
      calculation_value:
        type: string
        description: >-
          Opaque calculation expression. The customer owns the formula; the
          platform does not publish statutory values.
      sequence:
        type: integer
        description: Order in which the component is calculated.
  PayProfile:
    type: object
    description: A named set of pay components used by pay runs.
    required:
      - id
      - name
    properties:
      id:
        type: string
      name:
        type: string
      currency:
        type: string
        description: ISO 4217 currency code of the profile.
      pay_frequency:
        type: string
        enum:
          - weekly
          - biweekly
          - semimonthly
          - monthly
      component_ids:
        type: array
        items:
          type: string
      active:
        type: boolean
  PayRun:
    type: object
    description: >-
      One payroll run. A run moves `draft` to `calculated` to `approved` to
      `finalised`; a finalised run can no longer be edited and returns 409
      `pay_run_already_finalised`.
    required:
      - id
      - status
      - jurisdiction
    properties:
      id:
        type: string
      period_id:
        type: string
      status:
        type: string
        enum:
          - draft
          - calculated
          - approved
          - finalised
      jurisdiction:
        type: string
        description: >-
          Jurisdiction whose rule pack applies to this run. The run may not
          be calculated unless the pack for this jurisdiction is `verified`.
      rule_pack_id:
        type: string
        nullable: true
      employee_count:
        type: integer
        minimum: 0
      currency:
        type: string
      totals:
        type: object
        description: Aggregates of the run. Amounts are in the run currency.
        additionalProperties: true
      calculated_at:
        type: string
        format: date-time
        nullable: true
      approved_at:
        type: string
        format: date-time
        nullable: true
      approved_by:
        type: string
        nullable: true
      finalised_at:
        type: string
        format: date-time
        nullable: true
  PayRunCreate:
    type: object
    required:
      - period_id
      - jurisdiction
    properties:
      period_id:
        type: string
      jurisdiction:
        type: string
        description: >-
          Jurisdiction that determines the rule pack. A jurisdiction with no
          pack returns 422 `rule_pack_missing`.
      employee_ids:
        type: array
        items:
          type: string
        description: Subset of employees to include. All active employees when omitted.
      run_type:
        type: string
        default: regular
        enum:
          - regular
          - off_cycle
          - correction
      currency:
        type: string
  PayRunCalculateRequest:
    type: object
    description: >-
      Calculation input. `dry_run` defaults to true: a dry run computes
      everything and writes nothing.
    properties:
      dry_run:
        type: boolean
        default: true
        description: >-
          True computes the run without persisting results. False persists
          the calculation and moves the run to `calculated`.
      employee_ids:
        type: array
        items:
          type: string
        description: Restrict the calculation to these employees.
      include_zero:
        type: boolean
        default: false
        description: Include employees with a zero result.
  ReconciliationReport:
    type: object
    description: >-
      A comparison of the computed run against the source data and the
      previous period, with the variances that need a human look.
    required:
      - run_id
      - checks
    properties:
      run_id:
        type: string
      generated_at:
        type: string
        format: date-time
      totals:
        type: object
        additionalProperties: true
      by_component:
        type: array
        items:
          type: object
          additionalProperties: true
      variances:
        type: array
        items:
          type: object
          required:
            - code
          properties:
            code:
              type: string
              description: Machine readable variance kind, for example `headcount_delta`.
            entity:
              type: string
              nullable: true
            amount:
              type: number
            explanation:
              type: string
      checks:
        type: array
        items:
          type: object
          required:
            - name
            - passed
          properties:
            name:
              type: string
            passed:
              type: boolean
            detail:
              type: string
  Payslip:
    type: object
    description: >-
      The payslip of one employee for one run. Amounts are in the run
      currency and are only final once the run is finalised.
    required:
      - id
      - run_id
      - employee_id
    properties:
      id:
        type: string
      run_id:
        type: string
      employee_id:
        type: string
      period_id:
        type: string
      currency:
        type: string
      gross:
        type: number
      deductions:
        type: number
      net:
        type: number
      lines:
        type: array
        items:
          type: object
          required:
            - code
            - name
            - amount
          properties:
            code:
              type: string
            name:
              type: string
            amount:
              type: number
            category:
              type: string
      inputs_json:
        type: string
        nullable: true
        description: >-
          The approved time and leave the slip was calculated from, as a JSON
          object: the approved and unapproved time entry counts, the approved
          worked and overtime hours, and the paid and unpaid leave days. Null
          on a slip written before the record existed.
      issued_at:
        type: string
        format: date-time
        nullable: true
  PaymentFile:
    type: object
    description: >-
      The exported payment file of a finalised run. The file itself is
      fetched from the download URL, never inlined.
    required:
      - run_id
      - format
      - filename
    properties:
      run_id:
        type: string
      format:
        type: string
        enum:
          - csv
          - camt053
          - sepa
          - ach
      filename:
        type: string
      content_type:
        type: string
      size_bytes:
        type: integer
        minimum: 0
      sha256:
        type: string
      generated_at:
        type: string
        format: date-time
      download_url:
        type: string
        description: Short lived URL. The file is served by the object storage backend.

  # ----------------------------------------------------------- forecasting --
  ForecastRunCreate:
    type: object
    description: >-
      What to forecast, how, and for how long. The series is a metric of
      this deployment, not a cross tenant query.
    required:
      - series
      - horizon
    properties:
      series:
        type: object
        description: The metric to forecast.
        required:
          - metric
        properties:
          metric:
            type: string
            description: Metric key, for example `headcount` or `absence_rate`.
          filters:
            type: object
            additionalProperties: true
            description: Optional dimension filters inside this deployment.
          granularity:
            type: string
            default: week
            enum:
              - day
              - week
              - month
      method:
        type: string
        default: auto
        description: >-
          Forecast method. `auto` lets the server pick from the data. Every
          other value is an explicit override and is recorded in the result.
        enum:
          - auto
          - exponential_smoothing
          - holt_winters
          - moving_average
          - seasonal_naive
          - linear_regression
      horizon:
        type: integer
        minimum: 1
        description: Number of periods to forecast.
      backtest_window:
        type: integer
        minimum: 1
        description: Number of holdout periods used to measure the error.
      min_history_weeks:
        type: integer
        minimum: 1
        description: >-
          Minimum history the method needs. Below it the run is still
          created but is flagged `insufficient_history` and the forecast
          values are omitted.
  ForecastRun:
    type: object
    description: >-
      One forecast run, with everything needed to judge it: the method that
      was used, the window it was fitted on, the measured error on a
      holdout, the confidence band, and a hash of the input so the run can
      be reproduced.
    required:
      - id
      - series
      - method
      - version
      - input_hash
      - insufficient_history
    properties:
      id:
        type: string
      series:
        type: object
        additionalProperties: true
      method:
        type: string
        description: The method that was actually used. Resolved when the request said `auto`.
      method_version:
        type: string
        description: Version of the forecasting implementation that produced the result.
      data_window:
        type: object
        description: The observations the model was fitted on.
        required:
          - start
          - end
          - observations
        properties:
          start:
            type: string
            format: date
          end:
            type: string
            format: date
          observations:
            type: integer
            minimum: 0
      backtest:
        type: object
        description: >-
          The measured error on a holdout. `mape` is the mean absolute
          percentage error, `mase` the mean absolute scaled error.
        required:
          - mape
          - mase
          - holdout_length
        properties:
          mape:
            type: number
            nullable: true
            description: Mean absolute percentage error over the holdout. Null when it cannot be computed.
          mase:
            type: number
            nullable: true
            description: Mean absolute scaled error over the holdout. Null when it cannot be computed.
          holdout_length:
            type: integer
            minimum: 0
            description: Number of periods held out of the fit.
          holdout_start:
            type: string
            format: date
          holdout_end:
            type: string
            format: date
      confidence_band:
        type: object
        description: The interval the forecast is stated with.
        properties:
          level:
            type: number
            description: Coverage of the interval, for example 0.8.
          method:
            type: string
            description: How the band was derived, for example `residual_variance`.
      forecast:
        type: array
        items:
          type: object
          required:
            - period
            - value
          properties:
            period:
              type: string
              format: date
            value:
              type: number
            lower:
              type: number
            upper:
              type: number
      input_hash:
        type: string
        description: >-
          Hash of the exact input the run was computed from. The same input
          hash means the same run.
      version:
        type: integer
        minimum: 1
        description: Version of this run. A re-run of the same input creates a new version.
      insufficient_history:
        type: boolean
        description: >-
          True when the series had less history than the method requires.
          The run is recorded but the forecast values are omitted.
      created_at:
        type: string
        format: date-time
      created_by:
        type: string
  ForecastScenario:
    type: object
    description: >-
      A named set of assumptions on top of a forecast run. The assumptions
      are always shown, never applied silently. A scenario is versioned:
      editing it stores a NEW version under the same lineage root and the
      old versions stay intact and comparable.
    required:
      - id
      - name
      - assumptions
    properties:
      id:
        type: string
      name:
        type: string
      description:
        type: string
      base_run_id:
        type: string
        nullable: true
      version_no:
        type: integer
        minimum: 1
        description: 1 for the first version; each edit creates the next number.
      root_id:
        type: string
        nullable: true
        description: The lineage root — the id of the first version of this scenario.
      source:
        type: string
        enum: [created, edited, forked]
        description: How this version came into existence.
      forked_from_scenario_id:
        type: string
        nullable: true
        description: For forks only — the exact version whose assumptions were copied.
      assumptions:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - key
            - value
          properties:
            key:
              type: string
              description: Machine readable assumption key, for example `absence_rate_delta`.
            value:
              type: number
            unit:
              type: string
            note:
              type: string
              description: Why the assumption was made.
      created_at:
        type: string
        format: date-time
  ScenarioComparisonRequest:
    type: object
    description: >-
      Compare scenarios. Every assumption that is applied is returned in the
      response so the comparison is reproducible.
    required:
      - scenario_ids
    properties:
      scenario_ids:
        type: array
        minItems: 2
        items:
          type: string
      horizon:
        type: integer
        minimum: 1
        description: Periods to compare. Defaults to the shortest scenario horizon.
  ScenarioComparison:
    type: object
    description: The side by side result of a scenario comparison.
    required:
      - scenarios
      - assumptions
    properties:
      scenarios:
        type: array
        items:
          $ref: '#/components/schemas/ForecastScenario'
      assumptions:
        type: array
        items:
          type: object
          additionalProperties: true
        description: The assumptions that were in force, with their origin.
      series:
        type: array
        items:
          type: object
          additionalProperties: true
        description: One row per period with the value of every scenario.
      deltas:
        type: array
        items:
          type: object
          additionalProperties: true
        description: Difference of every scenario against the first one.

  ScenarioAssumption:
    type: object
    description: A single named assumption in a scenario.
    required:
      - key
      - value
      - unit
    properties:
      key:
        type: string
        description: "Assumption type: demand_multiplier, demand_delta, headcount_cap, seasonality_override, method_override"
      value:
        type: number
        description: Assumption value (ratio for multiplier, absolute for delta/cap)
      unit:
        type: string
        description: "Unit: ratio, absolute, days, method"
      note:
        type: string
        nullable: true
        description: Human-readable explanation of this assumption

  ScenarioCreate:
    type: object
    description: Request to create a scenario from a base forecast run.
    required:
      - base_run_id
      - name
      - assumptions
    properties:
      base_run_id:
        type: integer
        description: The forecast run this scenario is based on
      name:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type: string
        nullable: true
      assumptions:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/ScenarioAssumption'

  Scenario:
    allOf:
      - $ref: '#/components/schemas/ForecastScenario'
      - type: object
        properties:
          results:
            type: array
            items:
              type: object
              required:
                - horizon_step
                - forecast_date
                - predicted_value
              properties:
                horizon_step:
                  type: integer
                forecast_date:
                  type: string
                  format: date
                predicted_value:
                  type: number
                lower_bound:
                  type: number
                  nullable: true
                upper_bound:
                  type: number
                  nullable: true
                method_used:
                  type: string
                input_hash:
                  type: string
                rule_version:
                  type: string
                data_start_date:
                  type: string
                  format: date-time
                  nullable: true
                data_end_date:
                  type: string
                  format: date-time
                  nullable: true
                series_key:
                  type: string

  PaginatedScenarios:
    allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Scenario'

  ScenarioComparisonRequest:
    type: object
    description: >-
      Request to compare scenarios. Each id may be ANY version of a
      scenario — the response carries every participant's version
      metadata. Hourly rates are optional: when they are supplied, every
      participant also gets an explicit cost projection of its own
      projected demand.
    required:
      - scenario_ids
    properties:
      scenario_ids:
        type: array
        minItems: 2
        items:
          type: integer
      hourly_costs:
        type: object
        additionalProperties:
          type: number
        description: >-
          Optional explicit hourly rates for a cost projection per
          participant. Must include a `default` rate (or be exactly one
          rate). Costs appear ONLY when the caller supplies them; every
          row is labelled `excludes statutory on-costs`.

  ScenarioComparison:
    type: object
    description: Side-by-side comparison of scenarios and versions.
    required:
      - scenarios
      - comparison
    properties:
      scenarios:
        type: array
        items:
          $ref: '#/components/schemas/Scenario'
      costs:
        type: object
        nullable: true
        additionalProperties:
          $ref: '#/components/schemas/ScenarioCostProjection'
        description: >-
          The participants' explicit cost projections, keyed by scenario
          id. Present only when the request supplied hourly rates.

  ScenarioEditCreate:
    type: object
    description: >-
      Request to edit a scenario. Editing stores a NEW version of the
      scenario; the previous versions stay intact and comparable. Assumptions
      are the full, edited set — every key must be a known assumption type.
    required:
      - assumptions
    properties:
      assumptions:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/ScenarioAssumption'
      name:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type: string

  ScenarioForkCreate:
    type: object
    description: >-
      Request to fork a scenario version into a new, independent lineage.
      The fork copies the source version's assumptions and records which
      version it forked from.
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type: string

  ScenarioVersionSummary:
    allOf:
      - $ref: '#/components/schemas/Scenario'
    description: One version of a scenario lineage.

  ScenarioVersionSummaryList:
    type: object
    description: All versions of a scenario's lineage, oldest first.
    required:
      - items
    properties:
      items:
        type: array
        items:
          $ref: '#/components/schemas/ScenarioVersionSummary'

  ScenarioCostProjectionRow:
    type: object
    description: >-
      One cost line of a participant's cost projection: projected demand
      hours for one month multiplied by the assumed hourly rate.
    required:
      - period
      - hours
      - hourly_cost
      - cost
    properties:
      period:
        type: string
        description: Month bucket, YYYY-MM.
      hours:
        type: number
      hourly_cost:
        type: number
      cost:
        type: number
      cost_basis:
        type: string
        description: Always `excludes statutory on-costs`.

  ScenarioCostProjection:
    type: object
    description: >-
      A participant's explicit cost projection of its projected demand.
      Rates come from the request; wage_growth_pct compounds them month
      by month. Nothing here is implicit.
    required:
      - hourly_costs
      - wage_growth_pct
      - rows
    properties:
      scenario_id:
        type: integer
      hourly_costs:
        type: object
        additionalProperties:
          type: number
      wage_growth_pct:
        type: number
      rows:
        type: array
        items:
          $ref: '#/components/schemas/ScenarioCostProjectionRow'
      total_hours:
        type: number
      total_cost:
        type: number
      total_cost_delta:
        type: number
        nullable: true
        description: Against the first participant of the comparison.
      label:
        type: string
        description: Always `excludes statutory on-costs`.
      cost_basis:
        type: string
        description: Always `excludes statutory on-costs`.
      comparison:
        type: array
        items:
          type: object
          required:
            - horizon_step
            - forecast_date
            - base_value
            - scenario_values
            - deltas
            - assumptions
          properties:
            horizon_step:
              type: integer
            forecast_date:
              type: string
              format: date
            base_value:
              type: number
              nullable: true
            scenario_values:
              type: object
              additionalProperties:
                type: number
            deltas:
              type: object
              additionalProperties:
                type: number
            assumptions:
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioAssumption'

  # ------------------------------------------------------ forecasting (AN-01) --
  ForecastDataPoint:
    type: object
    required:
      - date
      - value
    properties:
      date:
        type: string
        format: date
      value:
        type: number
  ForecastRunCreate:
    type: object
    required:
      - series_data
    properties:
      name:
        type: string
        maxLength: 200
      description:
        type: string
      series_data:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/ForecastDataPoint'
      horizon_days:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
      method:
        type: string
        enum: [seasonal_naive, holt_winters, auto]
        default: auto
      seasonality:
        type: integer
        minimum: 2
        maximum: 365
        default: 7
      series_selector:
        type: string
        default: default
      location_id:
        type: integer
      role_id:
        type: integer
  ForecastRun:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      description:
        type: string
      status:
        type: string
        enum: [pending, running, completed, failed]
      horizon_days:
        type: integer
      method:
        type: string
      location_id:
        type: integer
      role_id:
        type: integer
      data_start_date:
        type: string
        format: date
      data_end_date:
        type: string
        format: date
      backtest_mape:
        type: number
      backtest_mase:
        type: number
      backtest_holdout_days:
        type: integer
      created_at:
        type: string
        format: date-time
      finished_at:
        type: string
        format: date-time
      results:
        type: array
        items:
          $ref: '#/components/schemas/ForecastResult'
  ForecastResult:
    type: object
    properties:
      horizon_step:
        type: integer
      forecast_date:
        type: string
        format: date
      predicted_value:
        type: number
      lower_bound:
        type: number
      upper_bound:
        type: number
      method_used:
        type: string
      input_hash:
        type: string
      rule_version:
        type: string
      data_start_date:
        type: string
        format: date
      data_end_date:
        type: string
        format: date
      series_key:
        type: string
  PaginatedForecastRuns:
    allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ForecastRun'
  ForecastDemandSeries:
    type: object
    properties:
      forecast_run_id:
        type: integer
      metadata:
        type: object
        properties:
          forecast_run_id:
            type: integer
          name:
            type: string
          description:
            type: string
          location_id:
            type: integer
          location_code:
            type: string
          role_id:
            type: integer
          role:
            type: string
          role_code:
            type: string
          horizon_days:
            type: integer
          method:
            type: string
          data_start_date:
            type: string
            format: date
          data_end_date:
            type: string
            format: date
          backtest_mape:
            type: number
          backtest_mase:
            type: number
          backtest_holdout_days:
            type: integer
          status:
            type: string
          created_at:
            type: string
            format: date-time
          finished_at:
            type: string
            format: date-time
      count:
        type: integer
      series:
        type: array
        items:
          type: object
          properties:
            date:
              type: string
              format: date
            value:
              type: number
            lower_bound:
              type: number
            upper_bound:
              type: number
            location_id:
              type: integer
            location_code:
              type: string
            role_id:
              type: integer
            role:
              type: string
            role_code:
              type: string
            source:
              type: string
            forecast_run_id:
              type: integer
  DriverCSVResponse:
    type: object
    properties:
      count:
        type: integer
      series:
        type: array
        items:
          type: object
          properties:
            date:
              type: string
              format: date
            value:
              type: number
            location_id:
              type: integer
            location_code:
              type: string
            role:
              type: string
  DemandSeriesRequest:
    type: object
    required:
      - start_date
      - end_date
    properties:
      start_date:
        type: string
        format: date
      end_date:
        type: string
        format: date
      location_id:
        type: integer
      role:
        type: string
      job_id:
        type: integer
      include_time_entries:
        type: boolean
        default: true
      include_leave:
        type: boolean
        default: true
      include_roster:
        type: boolean
        default: true
  DemandSeriesResponse:
    type: object
    properties:
      count:
        type: integer
      series:
        type: array
        items:
          type: object
          properties:
            date:
              type: string
              format: date
            value:
              type: number
            actual_hours:
              type: number
            leave_hours:
              type: number
            scheduled_hours:
              type: number
            location_id:
              type: integer
            role:
              type: string


  # --------------------------------------------------------------- imports --
  ImportUpload:
    type: object
    description: >-
      An uploaded import file, before it is dry run or committed. The upload
      expires if it is not used.
    required:
      - id
      - entity
      - filename
      - status
      - uploaded_at
    properties:
      id:
        type: string
      entity:
        type: string
        description: The entity the file targets, for example `employee`.
      filename:
        type: string
      content_type:
        type: string
      size_bytes:
        type: integer
        minimum: 0
      checksum:
        type: string
      status:
        type: string
        enum:
          - uploaded
          - dry_run_complete
          - committed
          - rejected
          - expired
      template_version:
        type: string
        description: Version of the template the file was validated against.
      uploaded_at:
        type: string
        format: date-time
      uploaded_by:
        type: string
      expires_at:
        type: string
        format: date-time
  ImportUploadRequest:
    type: object
    description: >-
      The parts of an import upload. The `file` part carries the bytes, the
      other parts carry the metadata.
    required:
      - file
    properties:
      file:
        type: string
        format: binary
        description: The CSV file to import.
      entity:
        type: string
        description: >-
          The entity the file targets, for example `employee`. When it is
          omitted the server derives it from the headers of the file.
      template_version:
        type: string
        description: >-
          The version of the template the caller built the file from. It is
          reported back on the upload so a mismatch can be spotted.
      dry_run:
        type: boolean
        default: false
        description: >-
          Validate the file as soon as it is uploaded instead of waiting for
          an explicit dry run.
  ImportTemplate:
    type: object
    description: >-
      The exact columns one import entity expects. A file with an unknown
      column is rejected with 422 `import_header_unknown`; the list here is
      what a client must build the file from.
    required:
      - entity
      - version
      - columns
    properties:
      entity:
        type: string
      version:
        type: string
      delimiter:
        type: string
        default: ','
      encoding:
        type: string
        default: utf-8
      columns:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - name
            - required
            - type
          properties:
            name:
              type: string
              description: Exact header text expected in the file.
            required:
              type: boolean
            type:
              type: string
              enum:
                - string
                - integer
                - decimal
                - date
                - datetime
                - boolean
                - enum
            description:
              type: string
            allowed_values:
              type: array
              items:
                type: string
            max_length:
              type: integer
  ImportDryRunResult:
    type: object
    description: >-
      The outcome of validating a file without writing anything. The
      `result_hash` covers the counts and the rejected rows; the commit
      must present a confirmation token that is bound to it.
    required:
      - upload_id
      - counts
      - result_hash
    properties:
      upload_id:
        type: string
      counts:
        type: object
        required:
          - created
          - updated
          - unchanged
          - rejected
          - total
        properties:
          created:
            type: integer
            minimum: 0
          updated:
            type: integer
            minimum: 0
          unchanged:
            type: integer
            minimum: 0
          rejected:
            type: integer
            minimum: 0
          total:
            type: integer
            minimum: 0
      result_hash:
        type: string
        description: >-
          Hash of the dry run outcome. The commit request must quote it and
          the confirmation token must be bound to it.
      confirmation_token:
        type: string
        description: >-
          Opaque token to present at commit time. It is bound to the result
          hash; a token that does not match returns 422
          `import_confirm_token_invalid`.
      errors:
        type: array
        description: A sample of the rejected rows, for display only.
        items:
          type: object
          required:
            - row
            - reason
          properties:
            row:
              type: integer
              minimum: 1
            field:
              type: string
              nullable: true
            reason:
              type: string
            code:
              type: string
              description: A code from the shared code list, for example `import_row_invalid`.
      errors_csv:
        type: object
        description: The downloadable row error report.
        required:
          - filename
          - download_url
        properties:
          filename:
            type: string
          download_url:
            type: string
            description: Short lived URL of the CSV with one row per rejected line.
          expires_at:
            type: string
            format: date-time
      expires_at:
        type: string
        format: date-time
        description: After this moment the confirmation token is no longer valid.
  ImportCommitRequest:
    type: object
    description: >-
      The confirmation of an import. The token and the result hash must
      match the dry run they refer to.
    required:
      - confirmation_token
      - result_hash
    properties:
      confirmation_token:
        type: string
        description: The token returned by the dry run.
      result_hash:
        type: string
        description: The result hash returned by the dry run.
      comment:
        type: string
        maxLength: 500
        description: Optional note stored with the import record.
  ImportSummary:
    type: object
    description: The record of one import run.
    required:
      - id
      - entity
      - status
    properties:
      id:
        type: string
      entity:
        type: string
      status:
        type: string
        enum:
          - uploaded
          - dry_run_complete
          - committed
          - rejected
          - expired
      counts:
        type: object
        additionalProperties: true
      result_hash:
        type: string
        nullable: true
      job_id:
        type: string
        nullable: true
        description: Background job that applied the import.
      committed_at:
        type: string
        format: date-time
        nullable: true
      committed_by:
        type: string
        nullable: true

  # ------------------------------------------------------------ onboarding --
  OnboardingState:
    type: object
    description: >-
      The resumable setup state machine of this deployment. Every step can
      be submitted again; the state records what is done and what is next.
    required:
      - current_step
      - completed_steps
      - progress
    properties:
      current_step:
        type: string
        nullable: true
        description: >-
          The step the deployment is waiting on. Null when the setup is
          finished.
        enum:
          - company_profile
          - business_type
          - modules
          - import
          - roles
          - review
          - launch
          - null
      completed_steps:
        type: array
        items:
          type: string
          enum:
            - company_profile
            - business_type
            - modules
            - import
            - roles
            - review
            - launch
      steps:
        type: array
        items:
          type: object
          required:
            - id
            - status
          properties:
            id:
              type: string
            title:
              type: string
            status:
              type: string
              enum:
                - pending
                - in_progress
                - complete
                - skipped
            required:
              type: boolean
            completed_at:
              type: string
              format: date-time
              nullable: true
      progress:
        type: object
        required:
          - completed
          - total
        properties:
          completed:
            type: integer
            minimum: 0
          total:
            type: integer
            minimum: 0
          percent:
            type: integer
            minimum: 0
            maximum: 100
      started_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      deployment_ready:
        type: boolean
        description: True when the deployment has been launched and is ready for use.
  OnboardingStepSubmission:
    type: object
    description: >-
      The payload of one setup step. The accepted fields depend on the step
      named in the path; a field the step does not know is rejected with 422
      `validation_error`.
    properties:
      data:
        type: object
        additionalProperties: true
        description: The step payload. Shape depends on the step.
      skip:
        type: boolean
        default: false
        description: >-
          Mark an optional step as skipped. A required step cannot be
          skipped.
      confirm:
        type: boolean
        default: true
        description: Recompute the downstream steps after this submission.
  OnboardingPreset:
    type: object
    description: >-
      A starting configuration for a kind of business: the modules to
      enable, the default roles and the recommended settings.
    required:
      - id
      - name
      - modules
    properties:
      id:
        type: string
      name:
        type: string
      description:
        type: string
      industry:
        type: string
        nullable: true
      modules:
        type: array
        items:
          type: string
      default_roles:
        type: array
        items:
          type: object
          additionalProperties: true
      recommended_settings:
        type: object
        additionalProperties: true
  OnboardingLaunchRequest:
    type: object
    description: >-
      The launch of this deployment. The call is idempotent: launching an
      already launched deployment returns the same result.
    properties:
      confirm:
        type: boolean
        default: true
        description: Must be true. Guards against an accidental launch.
      dry_run:
        type: boolean
        default: false
        description: Report what the launch would do without doing it.
  OnboardingLaunchResponse:
    type: object
    required:
      - launched
    properties:
      launched:
        type: boolean
      already_launched:
        type: boolean
        description: True when the deployment was already launched. The call was a no op.
      job_id:
        type: string
        nullable: true
        description: Background job that prepares the deployment, when there is one.
  ConfigGap:
    type: object
    description: >-
      One result of the configuration assistant: something that is missing
      or inconsistent, what it means, and what can be done about it.
    required:
      - rule_id
      - severity
      - message
      - fix_target
    properties:
      rule_id:
        type: string
        description: Stable id of the configuration rule.
      severity:
        type: string
        enum:
          - blocking
          - warning
          - info
      message:
        type: string
        description: What is wrong, in words a person can act on.
      fix_target:
        type: string
        description: >-
          What has to change: a module, an entity or a field. The fix endpoint
          takes this value back.
      entity:
        type: string
        nullable: true
      auto_fixable:
        type: boolean
        description: True when the fix can be applied without further input.
      applied:
        type: boolean
        description: True when the gap has already been resolved.
  ConfigGapFixRequest:
    type: object
    description: The request that resolves one configuration gap.
    properties:
      parameters:
        type: object
        additionalProperties: true
        description: Values the fix needs. Empty for an auto fix.
      dry_run:
        type: boolean
        default: false
        description: Report what the fix would do without applying it.

  # ----------------------------------------------------------------- admin --
  AuditEntry:
    type: object
    description: >-
      One link of the audit chain. Each entry hashes the previous entry, so
      a removed or edited row breaks the chain at that point.
    required:
      - id
      - action
      - entity_type
      - occurred_at
      - entry_hash
    properties:
      id:
        type: string
      actor_id:
        type: string
        nullable: true
      actor_username:
        type: string
        nullable: true
      action:
        type: string
        description: What was done, for example `leave.approve`.
      entity_type:
        type: string
      entity_id:
        type: string
        nullable: true
      outcome:
        type: string
        enum:
          - success
          - failure
      request_id:
        type: string
        nullable: true
      occurred_at:
        type: string
        format: date-time
      previous_hash:
        type: string
        nullable: true
      entry_hash:
        type: string
        description: Hash of this entry, including the hash of the previous one.
  AuditVerification:
    type: object
    description: >-
      The result of walking the audit chain. When the chain is broken the
      first broken link is reported, with the index it was found at.
    required:
      - verified
      - checked_entries
    properties:
      verified:
        type: boolean
      checked_entries:
        type: integer
        minimum: 0
      head:
        type: string
        nullable: true
        description: >-
          The head hash the walk compared against. Record it with
          `checked_entries` outside the database; the chain alone cannot
          detect a full rewrite. The verification's own entry becomes the
          next head, so the pair is the anchor.
      head_id:
        type: integer
        nullable: true
        description: The id of the entry the head names.
      first_broken:
        type: object
        nullable: true
        description: Where the chain stopped holding.
        required:
          - index
          - reason
        properties:
          id:
            type: string
            nullable: true
          index:
            type: integer
            minimum: 0
          reason:
            type: string
            description: >-
              Machine readable reason: `hash_mismatch` (an entry was edited),
              `missing_predecessor` (an entry was inserted, removed or reordered
              in the middle) or `head_mismatch` (entries were removed from the
              end, or the head was rewritten).
      verified_at:
        type: string
        format: date-time
  AdminStatus:
    type: object
    description: >-
      The operational status of the deployment: upgrade status, backup
      status and actionable operational warnings. Read only.
    required:
      - app_version
      - environment
      - upgrade
      - backup
      - warnings
      - checked_at
    properties:
      app_version:
        type: string
      environment:
        type: string
      upgrade:
        $ref: '#/components/schemas/UpgradeStatus'
      backup:
        $ref: '#/components/schemas/BackupStatus'
      warnings:
        type: array
        items:
          $ref: '#/components/schemas/OperationalWarning'
      checked_at:
        type: string
        format: date-time
  UpgradeStatus:
    type: object
    description: >-
      Which release the database schema matches, if that is known.
    properties:
      current_revision:
        type: string
        nullable: true
      head_revision:
        type: string
        nullable: true
      up_to_date:
        type: boolean
        nullable: true
      status:
        type: string
  BackupStatus:
    type: object
    description: >-
      What the operator arranged for backups, read from the BACKUP_*
      environment defaults. Unset means not arranged.
    required:
      - configured
      - schedule
    properties:
      configured:
        type: boolean
      schedule:
        type: string
      last_success_at:
        type: string
        format: date-time
        nullable: true
      stale:
        type: boolean
        nullable: true
  OperationalWarning:
    type: object
    description: One actionable condition the administrator should look at.
    required:
      - code
      - severity
      - message
    properties:
      code:
        type: string
      severity:
        type: string
      message:
        type: string
  RetentionSchedule:
    type: object
    description: >-
      How long the records of one entity are kept, and what happens to them
      afterwards. The schedule is the customer policy; the platform does
      not impose statutory retention values.
    required:
      - entity
      - retention_days
      - action
    properties:
      entity:
        type: string
      retention_days:
        type: integer
        minimum: 1
      action:
        type: string
        enum:
          - purge
          - anonymise
          - archive
      legal_hold:
        type: boolean
        description: >-
          While a hold is in place the schedule does not run, whatever it
          says.
      updated_at:
        type: string
        format: date-time
      updated_by:
        type: string
      last_run_at:
        type: string
        format: date-time
        nullable: true
  RetentionScheduleUpdate:
    type: object
    required:
      - entity
      - retention_days
      - action
    properties:
      entity:
        type: string
      retention_days:
        type: integer
        minimum: 1
      action:
        type: string
        enum:
          - purge
          - anonymise
          - archive
      legal_hold:
        type: boolean
  ErasureRequest:
    type: object
    description: >-
      A request to erase the personal data of one subject. The request is
      handled by a background job and never removes rows that are under a
      legal hold.
    required:
      - id
      - subject_type
      - status
      - requested_at
    properties:
      id:
        type: string
      employee_id:
        type: string
        nullable: true
      subject_type:
        type: string
        enum:
          - employee
          - applicant
          - contractor
      status:
        type: string
        enum:
          - open
          - processing
          - completed
          - rejected
      legal_basis:
        type: string
        nullable: true
        description: The basis the erasure was made under.
      requested_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
        nullable: true
      job_id:
        type: string
        nullable: true
  ErasureRequestCreate:
    type: object
    required:
      - subject_type
    properties:
      employee_id:
        type: string
        description: Required when `subject_type` is `employee`.
      subject_type:
        type: string
        enum:
          - employee
          - applicant
          - contractor
      legal_basis:
        type: string
        maxLength: 500
      reason:
        type: string
        maxLength: 500
  DsarExport:
    type: object
    description: >-
      A data subject access export: the whole record the platform holds
      about one subject, in one file.
    required:
      - id
      - subject_type
      - status
      - requested_at
    properties:
      id:
        type: string
      employee_id:
        type: string
        nullable: true
      subject_type:
        type: string
        enum:
          - employee
          - applicant
          - contractor
      status:
        type: string
        enum:
          - queued
          - building
          - ready
          - expired
          - failed
      format:
        type: string
        enum:
          - json
          - zip
      requested_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
        nullable: true
      download_url:
        type: string
        nullable: true
        description: Short lived URL of the export file.
      expires_at:
        type: string
        format: date-time
        nullable: true
      file_sha256:
        type: string
        nullable: true
      job_id:
        type: string
        nullable: true
  DsarExportCreate:
    type: object
    required:
      - subject_type
    properties:
      employee_id:
        type: string
      subject_type:
        type: string
        enum:
          - employee
          - applicant
          - contractor
      format:
        type: string
        default: json
        enum:
          - json
          - zip
  RulePack:
    type: object
    description: >-
      A rule pack: the versioned rule set of one jurisdiction. A payroll
      run may only be calculated when the pack of its jurisdiction is
      `verified`.
    required:
      - id
      - name
      - jurisdiction
      - version
      - status
    properties:
      id:
        type: string
      name:
        type: string
      jurisdiction:
        type: string
      version:
        type: string
      status:
        type: string
        enum:
          - draft
          - verified
          - deprecated
          - rejected
      source:
        type: object
        description: Where the pack came from.
        properties:
          type:
            type: string
            enum:
              - bundled
              - uploaded
              - catalogue
          reference:
            type: string
          installed_at:
            type: string
            format: date-time
      verification:
        type: object
        description: The verification state of the pack.
        properties:
          verified_at:
            type: string
            format: date-time
            nullable: true
          verified_by:
            type: string
            nullable: true
          checks:
            type: array
            items:
              type: object
              additionalProperties: true
      signing:
        type: object
        description: The signature of the pack.
        properties:
          algorithm:
            type: string
          key_id:
            type: string
          signature:
            type: string
          signed_at:
            type: string
            format: date-time
      checksum:
        type: string
        description: Hash of the pack contents.
  PublicContact:
    type: object
    description: >-
      A message from the public contact form. The shape is closed: a field
      that is not one of these three is refused rather than ignored.
    required:
      - name
      - email
      - message
    properties:
      name:
        type: string
        maxLength: 120
        description: The sender's name.
      email:
        type: string
        format: email
        maxLength: 255
        description: The address the message was sent from.
      message:
        type: string
        maxLength: 4000
        description: The message itself.
  PublicContactAccepted:
    type: object
    description: >-
      The receipt. It says that the message was received and nothing else:
      the case id is not returned, because a sequential id is a thing a
      visitor can walk.
    required:
      - received
    properties:
      received:
        type: boolean
  ImportRowErrorCode:
    type: string
    description: >-
      Row-level error code returned by the import module. These are
      not HTTP envelope codes; they appear inside `rows[].errors[].code`.
      See `contracts/errors.md` §3.10.
    enum:
      - unknown_headers
      - missing_required
      - invalid_integer
      - invalid_number
      - invalid_boolean
      - invalid_date
      - invalid_datetime
      - invalid_time
      - invalid_email
      - invalid_enum
      - too_long
      - below_minimum
      - above_maximum
      - reference_not_found
      - cross_file_reference_not_found
      - duplicate_in_file
      - duplicate_exists
      - inconsistent_values
      - too_many_rows
      - file_too_large
      - not_utf8
      - malformed_csv
      - empty_file
      - no_header
      - write_failed
      - too_many_fields
      - too_few_fields
      - ledger_reduction_refused
      - ledger_no_movement
  CostForecastCreate:
    type: object
    description: >-
      Request to cost a forecast run. The hourly rates are explicit
      assumptions: matched to the demand series by role title or role code
      (case-insensitive), with a `default` catch-all. A demand group with
      no matching rate and no default is answered 422 — rates are never
      implicit.
    required:
      - hourly_costs
    properties:
      hourly_costs:
        type: object
        additionalProperties:
          type: number
          description: Hourly rate (currency units per hour).
        description: >-
          Rate per role title or role code, plus an optional `default`
          catch-all.
      start_date:
        type: string
        format: date
        description: Cost only forecast results from this date (inclusive).
      end_date:
        type: string
        format: date
        description: Cost only forecast results up to this date (inclusive).
  CostForecastRow:
    type: object
    description: >-
      One cost line of a stored cost forecast: forecast demand hours for
      one month x location x role, at the assumed rate. The assumptions
      and the statutory label are always shown, never implicit.
    required:
      - period
      - hours
      - hourly_cost
      - cost
    properties:
      period:
        type: string
        description: Month bucket of the demand, `YYYY-MM`.
      location_id:
        type: integer
        nullable: true
      location_code:
        type: string
        nullable: true
      role_id:
        type: integer
        nullable: true
      role:
        type: string
        nullable: true
      role_code:
        type: string
        nullable: true
      hours:
        type: number
        description: Forecast demand hours for this period/location/role.
      hourly_cost:
        type: number
        description: The hourly rate that was applied (the assumption in force).
      cost:
        type: number
        description: |-
          hours x hourly_cost for this period/location/role. **Excludes
          statutory on-costs.**
  CostForecast:
    type: object
    description: >-
      A stored, versioned labour cost forecast of one forecast run. A
      re-run of the same run creates a new version; the earlier versions
      stay intact for auditability. The result **excludes statutory
      on-costs** — employer contributions and statutory on-costs are not
      included, and the label is carried on every response and export.
    required:
      - id
      - forecast_run_id
      - version
      - label
      - hourly_costs
      - input_hash
      - periods
      - total_hours
      - total_cost
    properties:
      id:
        type: integer
      forecast_run_id:
        type: integer
      version:
        type: integer
        description: 1 = the first cost forecast of this run; each POST stores the next version.
      label:
        type: string
        enum:
        - excludes statutory on-costs
        description: Always "excludes statutory on-costs"; the cost is a labour-only projection.
      cost_basis:
        type: string
        description: Same label, carried on every row of every export.
      hourly_costs:
        type: object
        additionalProperties:
          type: number
        description: The rates that were applied (the assumptions in force).
      input_hash:
        type: string
        description: Hash of the run's forecast results plus the rates used.
      start_date:
        type: string
        format: date
        nullable: true
      end_date:
        type: string
        format: date
        nullable: true
      periods:
        type: integer
        description: Number of monthly cost lines stored.
      total_hours:
        type: number
      total_cost:
        type: number
        description: |-
          The costed total of the horizon. **Excludes statutory on-costs.**
      created_at:
        type: string
        format: date-time
      rows:
        type: array
        items:
          $ref: '#/components/schemas/CostForecastRow'
  CostForecastVersion:
    type: object
    description: A stored cost forecast version, without its rows.
    properties:
      id:
        type: integer
      forecast_run_id:
        type: integer
      version:
        type: integer
      label:
        type: string
      cost_basis:
        type: string
      hourly_costs:
        type: object
        additionalProperties:
          type: number
      input_hash:
        type: string
      start_date:
        type: string
        format: date
        nullable: true
      end_date:
        type: string
        format: date
        nullable: true
      periods:
        type: integer
      total_hours:
        type: number
      total_cost:
        type: number
      created_at:
        type: string
        format: date-time
  CostForecastVersionList:
    type: object
    description: All stored versions of a run's cost forecast, newest first.
    required:
      - items
    properties:
      items:
        type: array
        items:
          $ref: '#/components/schemas/CostForecastVersion'
  ForecastAccuracyRecord:
    type: object
    description: >-
      One forecast-vs-actual accuracy row: for one forecast run, one
      month period, one location and one role, the forecast hours
      compared with the actual hours the same window measured. MAPE is
      a fraction (0.10 is 10 %) over the pairs whose actual is not
      zero; MAE and bias are in hours over every pair; bias is forecast
      minus actual, so positive means over-predicted. `status` is the
      confidence indicator, recomputed on every read from the stored
      MAPE against the thresholds of the request: `ok` at or under
      `review_threshold`, `review` at or under `degraded_threshold`,
      `degraded` over it. A MAPE that cannot be computed (every pair's
      actual is zero) is never `ok`; it is flagged `review`.
    required:
      - id
      - forecast_run_id
      - model_version
      - method_used
      - period
      - forecast_hours
      - actual_hours
      - mae
      - bias
      - sample_size
      - status
    properties:
      id:
        type: integer
      forecast_run_id:
        type: integer
      model_version:
        type: string
      method_used:
        type: string
      period:
        type: string
        description: The month bucket of the comparison dates, "YYYY-MM".
      location_id:
        type: integer
        nullable: true
      role_id:
        type: integer
        nullable: true
      forecast_hours:
        type: number
      actual_hours:
        type: number
      mape:
        type: number
        nullable: true
      mae:
        type: number
      bias:
        type: number
      sample_size:
        type: integer
      status:
        type: string
        enum: [ok, review, degraded]
      measured_at:
        type: string
        format: date-time
  ForecastAccuracySyncRequest:
    type: object
    description: >-
      The window to compare and the confidence thresholds to apply. The
      synchronous job compares every completed forecast run with
      results in the window against the actual hours measured, and
      replaces the rows it computes, so a re-run never stacks
      duplicates.
    required:
      - start_date
      - end_date
    properties:
      start_date:
        type: string
        format: date
      end_date:
        type: string
        format: date
      location_id:
        type: integer
        nullable: true
      role_id:
        type: integer
        nullable: true
      run_id:
        type: integer
        nullable: true
      review_threshold:
        type: number
        description: The MAPE at or under which a row is `ok`. Default 0.10.
      degraded_threshold:
        type: number
        description: The MAPE at or under which a row is `review`. Default 0.25.
  ForecastAccuracySyncResult:
    type: object
    description: The result of one accuracy sync run.
    required:
      - start_date
      - end_date
      - review_threshold
      - degraded_threshold
      - replaced
      - records
    properties:
      start_date:
        type: string
      end_date:
        type: string
      review_threshold:
        type: number
      degraded_threshold:
        type: number
      replaced:
        type: integer
        description: How many stored rows this run replaced.
      records:
        type: array
        items:
          $ref: '#/components/schemas/ForecastAccuracyRecord'
  PaginatedForecastAccuracy:
    allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ForecastAccuracyRecord'
  UpdateGate:
    type: object
    description: >-
      One fail-closed pre-install gate: name, pass/fail, and the named
      remediation when it fails. All gates must pass before an install.
    required:
      - gate
      - passed
      - remediation
    properties:
      gate:
        type: string
      passed:
        type: boolean
      remediation:
        type: string
      plan:
        type: string
        nullable: true
  UpdateHistoryEntry:
    type: object
    description: >-
      One recorded install attempt (in-process log; the audit chain is
      the durable record).
    properties:
      version:
        type: string
      manifest_sha256:
        type: string
      actor:
        type: string
      dry_run:
        type: boolean
      accepted:
        type: boolean
      gates:
        type: array
        items:
          $ref: '#/components/schemas/UpdateGate'
      recorded_at:
        type: string
        format: date-time
