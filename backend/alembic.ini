# Alembic configuration.
#
# The database URL is NOT set here. It is read from the application settings
# in `migrations/env.py` so that there is exactly one place that knows how to
# reach the database, and so no connection string is ever committed.
#
# `script_location` uses %(here)s so the file works from any working
# directory.
#
# Usage (from the `backend/` directory):
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "describe the change"
#   alembic current

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# The URL below is a placeholder. env.py overrides it with the application
# settings, and raises if it cannot resolve one.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# No automatic formatting hooks: a migration file that a human edited must
# not be rewritten by a tool.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
