version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: karmathy-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-karmathy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-karmathy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-karmathy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: karmathy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    # No source bind-mount: the image is the artefact that was built and tested.
    # Mounting ./backend over /app made the running code the checkout's, not the
    # image's, so a rollback could not restore the previous build.

  frontend:
    build: ./frontend
    container_name: karmathy-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  default:
    name: karmathy-net

volumes:
  pgdata:
