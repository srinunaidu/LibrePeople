description: Exchange refresh token for new access token and refresh token
url: http://localhost:8000/auth/refresh
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: text
  content: |-
    {
      "example": "payload"
    }
examples: ./.resources/Refresh Token.resources/examples
order: 2000
