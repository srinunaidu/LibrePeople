# Karmathy frontend — static bundle + API reverse proxy.
#
# The browser calls `/api/v1/...` on the same origin, so no VITE_API_URL is
# needed on the VM: this server forwards `/api/` to the backend service on the
# compose network and serves everything else from the built bundle.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not leak the nginx version.
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every unknown path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `index.html` must never be cached, or a deploy leaves browsers on the
    # previous bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
